<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1740" viewBox="0 0 900 1740" role="img"><title>Trie: существующий путь ещё не означает слово</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#64748b"/></marker></defs><rect width="900" height="1740" fill="white"/><text x="28" y="37" font-size="23" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Trie: существующий путь ещё не означает слово</text><rect x="14" y="72" width="872" height="411" rx="10" fill="#f8fafc" stroke="#dbe2ec"/><text x="28" y="100" font-size="20" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Шаг 1. Есть кот и ком; ищем ко</text><text x="28" y="127" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Обе буквы запроса удалось прочитать. Но после ко нет галочки: отдельного слова ко</text><text x="28" y="151" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">нет.</text><path d="M300,367 L380,394" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="345.0" y="375.5" font-size="14" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">м</text><path d="M450,227 L450,254" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="455.0" y="235.5" font-size="14" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">к</text><path d="M300,367 L220,394" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="265.0" y="375.5" font-size="14" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">т</text><path d="M450,297 L300,324" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="380.0" y="305.5" font-size="14" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">о</text><rect x="411.0" y="188" width="78" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="450" y="213" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">корень</text><rect x="421.0" y="258" width="58" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="450" y="283" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">•</text><rect x="271.0" y="328" width="58" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="300" y="353" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">•</text><rect x="351.0" y="398" width="58" height="38" rx="7" fill="#dcfce7" stroke="#16803c" stroke-width="2"/><text x="380" y="423" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">✓</text><rect x="191.0" y="398" width="58" height="38" rx="7" fill="#dcfce7" stroke="#16803c" stroke-width="2"/><text x="220" y="423" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">✓</text><rect x="14" y="507" width="872" height="387" rx="10" fill="#f8fafc" stroke="#dbe2ec"/><text x="28" y="535" font-size="20" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Шаг 2. Вставляем отдельное слово ко</text><text x="28" y="562" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Новых рёбер не нужно. Ставим галочку в уже существующей вершине.</text><path d="M300,778 L380,805" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="345.0" y="786.5" font-size="14" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">м</text><path d="M450,638 L450,665" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="455.0" y="646.5" font-size="14" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">к</text><path d="M300,778 L220,805" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="265.0" y="786.5" font-size="14" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">т</text><path d="M450,708 L300,735" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="380.0" y="716.5" font-size="14" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">о</text><rect x="411.0" y="599" width="78" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="450" y="624" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">корень</text><rect x="421.0" y="669" width="58" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="450" y="694" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">•</text><rect x="271.0" y="739" width="58" height="38" rx="7" fill="#dcfce7" stroke="#16803c" stroke-width="2"/><text x="300" y="764" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">✓</text><rect x="351.0" y="809" width="58" height="38" rx="7" fill="#dcfce7" stroke="#16803c" stroke-width="2"/><text x="380" y="834" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">✓</text><rect x="191.0" y="809" width="58" height="38" rx="7" fill="#dcfce7" stroke="#16803c" stroke-width="2"/><text x="220" y="834" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">✓</text><rect x="14" y="918" width="872" height="387" rx="10" fill="#f8fafc" stroke="#dbe2ec"/><text x="28" y="946" font-size="20" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Шаг 3. Удаляем кот</text><text x="28" y="973" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Снимаем галочку т и удаляем ненужный лист. Ветвь м и окончание ко остаются.</text><path d="M450,1119 L300,1146" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="380.0" y="1127.5" font-size="14" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">о</text><path d="M300,1189 L380,1216" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="345.0" y="1197.5" font-size="14" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">м</text><path d="M450,1049 L450,1076" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="455.0" y="1057.5" font-size="14" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">к</text><rect x="411.0" y="1010" width="78" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="450" y="1035" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">корень</text><rect x="421.0" y="1080" width="58" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="450" y="1105" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">•</text><rect x="271.0" y="1150" width="58" height="38" rx="7" fill="#dcfce7" stroke="#16803c" stroke-width="2"/><text x="300" y="1175" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">✓</text><rect x="351.0" y="1220" width="58" height="38" rx="7" fill="#dcfce7" stroke="#16803c" stroke-width="2"/><text x="380" y="1245" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">✓</text><rect x="14" y="1329" width="872" height="387" rx="10" fill="#f8fafc" stroke="#dbe2ec"/><text x="28" y="1357" font-size="20" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Шаг 4. Удаляем ко</text><text x="28" y="1384" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Только снимаем его галочку. Удалять вершину нельзя: через неё проходит слово ком.</text><path d="M450,1530 L300,1557" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="380.0" y="1538.5" font-size="14" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">о</text><path d="M300,1600 L380,1627" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="345.0" y="1608.5" font-size="14" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">м</text><path d="M450,1460 L450,1487" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="455.0" y="1468.5" font-size="14" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">к</text><rect x="411.0" y="1421" width="78" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="450" y="1446" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">корень</text><rect x="421.0" y="1491" width="58" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="450" y="1516" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">•</text><rect x="271.0" y="1561" width="58" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="300" y="1586" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">•</text><rect x="351.0" y="1631" width="58" height="38" rx="7" fill="#dcfce7" stroke="#16803c" stroke-width="2"/><text x="380" y="1656" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">✓</text></svg>