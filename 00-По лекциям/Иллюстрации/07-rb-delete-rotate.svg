.25" y="665" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">12К</text><rect x="739.75" y="640" width="58" height="38" rx="7" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/><text x="768.75" y="665" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">20К</text><rect x="14" y="744" width="872" height="336" rx="10" fill="#f8fafc" stroke="#dbe2ec"/><text x="28" y="772" font-size="20" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Шаг 3. Поднимаем 15; красим 20 в чёрный</text><text x="28" y="799" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">10 остаётся чёрным, 12 переезжает к нему вправо. На всех путях чёрная высота снова</text><text x="28" y="823" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">одинакова.</text><path d="M237.5,969 L343.75,996" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M450.0,899 L237.5,926" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M450.0,899 L662.5,926" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="421.0" y="860" width="58" height="38" rx="7" fill="#243247" stroke="#243247" stroke-width="2"/><text x="450.0" y="885" font-size="17" fill="white" text-anchor="middle" font-family="monospace">15Ч</text><rect x="208.5" y="930" width="58" height="38" rx="7" fill="#243247" stroke="#243247" stroke-width="2"/><text x="237.5" y="955" font-size="17" fill="white" text-anchor="middle" font-family="monospace">10Ч</text><rect x="314.75" y="1000" width="58" height="38" rx="7" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/><text x="343.75" y="1025" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">12К</text><rect x="633.5" y="930" width="58" height="38" rx="7" fill="#243247" stroke="#243247" stroke-width="2"/><text x="662.5" y="955" font-size="17" fill="white" text-anchor="middle" font-family="monospace">20Ч</text></svg>