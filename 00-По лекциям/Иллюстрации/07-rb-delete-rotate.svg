<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1104" viewBox="0 0 900 1104" role="img"><title>КЧ-удаление: дальний красный ребёнок позволяет закончить</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#64748b"/></marker></defs><rect width="900" height="1104" fill="white"/><text x="28" y="37" font-size="23" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">КЧ-удаление: дальний красный ребёнок позволяет закончить</text><rect x="14" y="72" width="872" height="312" rx="10" fill="#f8fafc" stroke="#dbe2ec"/><text x="28" y="100" font-size="20" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Шаг 1. До удаления 5</text><text x="28" y="127" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Чёрный брат 15 имеет дальнего красного ребёнка 20.</text><path d="M450.0,203 L237.5,230" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M662.5,273 L556.25,300" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M662.5,273 L768.75,300" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M450.0,203 L662.5,230" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="421.0" y="164" width="58" height="38" rx="7" fill="#243247" stroke="#243247" stroke-width="2"/><text x="450.0" y="189" font-size="17" fill="white" text-anchor="middle" font-family="monospace">10Ч</text><rect x="208.5" y="234" width="58" height="38" rx="7" fill="#243247" stroke="#243247" stroke-width="2"/><text x="237.5" y="259" font-size="17" fill="white" text-anchor="middle" font-family="monospace">5Ч</text><rect x="633.5" y="234" width="58" height="38" rx="7" fill="#243247" stroke="#243247" stroke-width="2"/><text x="662.5" y="259" font-size="17" fill="white" text-anchor="middle" font-family="monospace">15Ч</text><rect x=