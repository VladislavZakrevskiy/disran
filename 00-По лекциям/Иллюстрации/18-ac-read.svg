<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1213" viewBox="0 0 900 1213" role="img"><title>Читаем ababa: состояния и найденные слова</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#64748b"/></marker></defs><rect width="900" height="1213" fill="white"/><text x="28" y="37" font-size="23" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Читаем ababa: состояния и найденные слова</text><rect x="14" y="72" width="872" height="293" rx="10" fill="#f8fafc" stroke="#dbe2ec"/><text x="28" y="100" font-size="20" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Шаг 1. Читаем первые a и b</text><text x="28" y="127" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">После a состояние a: найден образец a с позиции 1. После b состояние ab: новых</text><text x="28" y="151" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">ответов нет.</text><text x="32" y="204" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Текст</text><rect x="168.0" y="179" width="44" height="38" rx="7" fill="#dcfce7" stroke="#16803c" stroke-width="2"/><text x="190" y="204" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">a</text><rect x="217.0" y="179" width="44" height="38" rx="7" fill="#dcfce7" stroke="#16803c" stroke-width="2"/><text x="239" y="204" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">b</text><rect x="266.0" y="179" width="44" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="288" y="204" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">a</text><rect x="315.0" y="179" width="44" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="337" y="204" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">b</text><rect x="364.0" y="179" width="44" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="386" y="204" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">a</text><text x="32" y="259" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Позиция</text><rect x="168.0" y="234" width="44" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="190" y="259" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">1</text><rect x="217.0" y="234" width="44" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="239" y="259" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">2</text><text x="32" y="314" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Состояние</text><rect x="168.0" y="289" width="44" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="190" y="314" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">a</text><rect x="217.0" y="289" width="44" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="239" y="314" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">ab</text><rect x="14" y="389" width="872" height="269" rx="10" fill="#f8fafc" stroke="#dbe2ec"/><text x="28" y="417" font-size="20" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Шаг 2. Третья буква a: состояние aba</text><text x="28" y="444" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Сообщаем aba, затем по выходам ba и a. Их начала: 1, 2 и 3.</text><text x="32" y="497" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Текст</text><rect x="168.0" y="472" width="44" height="38" rx="7" fill="#dcfce7" stroke="#16803c" stroke-width="2"/><text x="190" y="497" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">a</text><rect x="217.0" y="472" width="44" height="38" rx="7" fill="#dcfce7" stroke="#16803c" stroke-width="2"/><text x="239" y="497" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">b</text><rect x="266.0" y="472" width="44" height="38" rx="7" fill="#dcfce7" stroke="#16803c" stroke-width="2"/><text x="288" y="497" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">a</text><rect x="315.0" y="472" width="44" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="337" y="497" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">b</text><rect x="364.0" y="472" width="44" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="386" y="497" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">a</text><text x="32" y="552" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Выдаём</text><rect x="166.5" y="527" width="47" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="190" y="552" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">aba</text><rect x="218.5" y="527" width="47" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="242" y="552" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">→</text><rect x="270.5" y="527" width="47" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="294" y="552" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">ba</text><rect x="322.5" y="527" width="47" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="346" y="552" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">→</text><rect x="374.5" y="527" width="47" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="398" y="552" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">a</text><text x="32" y="607" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Начала</text><rect x="168.0" y="582" width="44" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="190" y="607" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">1</text><rect x="217.0" y="582" width="44" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="239" y="607" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace"></text><rect x="266.0" y="582" width="44" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="288" y="607" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">2</text><rect x="315.0" y="582" width="44" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="337" y="607" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace"></text><rect x="364.0" y="582" width="44" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="386" y="607" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">3</text><rect x="14" y="682" width="872" height="214" rx="10" fill="#f8fafc" stroke="#dbe2ec"/><text x="28" y="710" font-size="20" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Шаг 3. Четвёртая буква b: остаёмся на длинном пути</text><text x="28" y="737" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">После выдачи состояние всё ещё aba. По ребру b идём в abab: начало 1.</text><text x="32" y="790" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Текст</text><rect x="168.0" y="765" width="44" height="38" rx="7" fill="#dcfce7" stroke="#16803c" stroke-width="2"/><text x="190" y="790" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">a</text><rect x="217.0" y="765" width="44" height="38" rx="7" fill="#dcfce7" stroke="#16803c" stroke-width="2"/><text x="239" y="790" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">b</text><rect x="266.0" y="765" width="44" height="38" rx="7" fill="#dcfce7" stroke="#16803c" stroke-width="2"/><text x="288" y="790" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">a</text><rect x="315.0" y="765" width="44" height="38" rx="7" fill="#dcfce7" stroke="#16803c" stroke-width="2"/><text x="337" y="790" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">b</text><rect x="364.0" y="765" width="44" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="386" y="790" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">a</text><text x="32" y="845" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Переход</text><rect x="161.0" y="820" width="58" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="190" y="845" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">aba</text><rect x="224.0" y="820" width="58" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="253" y="845" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">→</text><rect x="287.0" y="820" width="58" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="316" y="845" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">abab</text><rect x="14" y="920" width="872" height="269" rx="10" fill="#f8fafc" stroke="#dbe2ec"/><text x="28" y="948" font-size="20" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Шаг 4. Пятая буква a: используем неудачу</text><text x="28" y="975" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">У abab нет ребра a. Ссылка ведёт в ab; оттуда по той же a идём в aba.</text><text x="32" y="1028" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Переход</text><rect x="161.0" y="1003" width="58" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="190" y="1028" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">abab</text><rect x="224.0" y="1003" width="58" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="253" y="1028" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">→</text><rect x="287.0" y="1003" width="58" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="316" y="1028" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">ab</text><rect x="350.0" y="1003" width="58" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="379" y="1028" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">→</text><rect x="413.0" y="1003" width="58" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="442" y="1028" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">aba</text><text x="32" y="1083" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Текст</text><rect x="168.0" y="1058" width="44" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="190" y="1083" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">a</text><rect x="217.0" y="1058" width="44" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="239" y="1083" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">b</text><rect x="266.0" y="1058" width="44" height="38" rx="7" fill="#dcfce7" stroke="#16803c" stroke-width="2"/><text x="288" y="1083" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">a</text><rect x="315.0" y="1058" width="44" height="38" rx="7" fill="#dcfce7" stroke="#16803c" stroke-width="2"/><text x="337" y="1083" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">b</text><rect x="364.0" y="1058" width="44" height="38" rx="7" fill="#dcfce7" stroke="#16803c" stroke-width="2"/><text x="386" y="1083" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">a</text><text x="32" y="1138" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Начала</text><rect x="168.0" y="1113" width="44" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="190" y="1138" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">3</text><rect x="217.0" y="1113" width="44" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="239" y="1138" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">4</text><rect x="266.0" y="1113" width="44" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="288" y="1138" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">5</text></svg>