<svg xmlns="http://www.w3.org/2000/svg" width="900" height="940" viewBox="0 0 900 940" role="img"><title>AVL: один поворот исправляет прямую цепочку</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#64748b"/></marker></defs><rect width="900" height="940" fill="white"/><text x="28" y="37" font-size="23" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">AVL: один поворот исправляет прямую цепочку</text><rect x="14" y="72" width="872" height="242" rx="10" fill="#f8fafc" stroke="#dbe2ec"/><text x="28" y="100" font-size="20" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Шаг 1. Вставлены 30 и 20</text><text x="28" y="127" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">У 30 левое поддерево выше правого на 1: это ещё допустимо.</text><path d="M450.0,203 L237.5,230" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="421.0" y="164" width="58" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="450.0" y="189" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">30</text><rect x="208.5" y="234" width="58" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="237.5" y="259" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">20</text><rect x="14" y="338" width="872" height="312" rx="10" fill="#f8fafc" stroke="#dbe2ec"/><text x="28" y="366" font-size="20" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Шаг 2. Вставляем 10</text><text x="28" y="393" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">У 30 баланс +2; у его левого ребёнка 20 баланс +1. Знаки одинаковы.</text><path d="M237.5,539 L131.25,566" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M450.0,469 L237.5,496" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="421.0" y="430" width="58" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="450.0" y="455" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">30</text><rect x="208.5" y="500" width="58" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="237.5" y="525" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">20</text><rect x="102.25" y="570" width="58" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="131.25" y="595" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">10</text><rect x="14" y="674" width="872" height="242" rx="10" fill="#f8fafc" stroke="#dbe2ec"/><text x="28" y="702" font-size="20" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Шаг 3. Правый поворот вокруг 30</text><text x="28" y="729" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">20 поднимается. С обеих сторон по одному листу, все балансы равны нулю.</text><path d="M450.0,805 L237.5,832" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M450.0,805 L662.5,832" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="421.0" y="766" width="58" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="450.0" y="791" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">20</text><rect x="208.5" y="836" width="58" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="237.5" y="861" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">10</text><rect x="633.5" y="836" width="58" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="662.5" y="861" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">30</text></svg>