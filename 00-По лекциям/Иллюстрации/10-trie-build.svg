<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1305" viewBox="0 0 900 1305" role="img"><title>Trie: общие буквы используют один путь</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#64748b"/></marker></defs><rect width="900" height="1305" fill="white"/><text x="28" y="37" font-size="23" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Trie: общие буквы используют один путь</text><rect x="14" y="72" width="872" height="387" rx="10" fill="#f8fafc" stroke="#dbe2ec"/><text x="28" y="100" font-size="20" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Шаг 1. Вставляем кот</text><text x="28" y="127" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Создаём три перехода: к, о, т. Зелёная отметка означает конец слова.</text><path d="M450,273 L300,300" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="380.0" y="281.5" font-size="14" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">о</text><path d="M300,343 L220,370" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="265.0" y="351.5" font-size="14" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">т</text><path d="M450,203 L450,230" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="455.0" y="211.5" font-size="14" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">к</text><rect x="411.0" y="164" width="78" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="450" y="189" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">корень</text><rect x="421.0" y="234" width="58" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="450" y="259" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">•</text><rect