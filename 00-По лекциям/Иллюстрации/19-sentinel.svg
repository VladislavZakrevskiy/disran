<svg xmlns="http://www.w3.org/2000/svg" width="900" height="784" viewBox="0 0 900 784" role="img"><title>Зачем нужен $: даём каждому суффиксу свой лист</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#64748b"/></marker></defs><rect width="900" height="784" fill="white"/><text x="28" y="37" font-size="23" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Зачем нужен $: даём каждому суффиксу свой лист</text><rect x="14" y="72" width="872" height="292" rx="10" fill="#f8fafc" stroke="#dbe2ec"/><text x="28" y="100" font-size="20" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Шаг 1. До сентинела: неявное дерево aba</text><text x="28" y="127" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Суффикс a заканчивается внутри ребра aba. Листа 3 ещё нет.</text><path d="M450,203 L250,275" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="355.0" y="234.0" font-size="14" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">aba</text><path d="M450,203 L650,275" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="555.0" y="234.0" font-size="14" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">ba</text><rect x="411.0" y="164" width="78" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="450" y="189" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">корень</text><rect x="211.0" y="279" width="78" height="38" rx="7" fill="#dcfce7" stroke="#16803c" stroke-width="2"/><text x="250" y="304" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">лист 1</text><rect x="611.0" y="279" width="78" height="38" rx="7" fill="#dcfce7" stroke="#16803c" stroke-width="2"/><text x="650" y="304" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">лист 2</text><rect x="14" y="388" width="872" height="372" rx="10" fill="#f8fafc" stroke="#dbe2ec"/><text x="28" y="416" font-size="20" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Шаг 2. После сентинела: явное дерево aba$</text><text x="28" y="443" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Появились развилка после a, лист 3 для a$ и лист 4 для $.</text><path d="M450,519 L250,566" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="355.0" y="537.5" font-size="14" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">a</text><path d="M250,609 L140,671" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="200.0" y="635.0" font-size="14" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">ba$</text><path d="M250,609 L350,671" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="305.0" y="635.0" font-size="14" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">$</text><path d="M450,519 L600,576" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="530.0" y="542.5" font-size="14" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">ba$</text><path d="M450,519 L790,576" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="625.0" y="542.5" font-size="14" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">$</text><rect x="411.0" y="480" width="78" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="450" y="505" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">корень</text><rect x="221.0" y="570" width="58" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="250" y="595" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">a</text><rect x="101.0" y="675" width="78" height="38" rx="7" fill="#dcfce7" stroke="#16803c" stroke-width="2"/><text x="140" y="700" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">лист 1</text><rect x="311.0" y="675" width="78" height="38" rx="7" fill="#dcfce7" stroke="#16803c" stroke-width="2"/><text x="350" y="700" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">лист 3</text><rect x="561.0" y="580" width="78" height="38" rx="7" fill="#dcfce7" stroke="#16803c" stroke-width="2"/><text x="600" y="605" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">лист 2</text><rect x="751.0" y="580" width="78" height="38" rx="7" fill="#dcfce7" stroke="#16803c" stroke-width="2"/><text x="790" y="605" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">лист 4</text></svg>