<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1466" viewBox="0 0 900 1466" role="img"><title>Суффиксное дерево aba$: вставляем четыре суффикса</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#64748b"/></marker></defs><rect width="900" height="1466" fill="white"/><text x="28" y="37" font-size="23" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Суффиксное дерево aba$: вставляем четыре суффикса</text><rect x="14" y="72" width="872" height="277" rx="10" fill="#f8fafc" stroke="#dbe2ec"/><text x="28" y="100" font-size="20" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Шаг 1. Вставляем aba$</text><text x="28" y="127" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Суффикс начинается в позиции 1 — поэтому номер листа 1.</text><path d="M450,203 L230,260" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="345.0" y="226.5" font-size="14" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">aba$</text><rect x="411.0" y="164" width="78" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="450" y="189" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">корень</text><rect x="191.0" y="264" width="78" height="38" rx="7" fill="#dcfce7" stroke="#16803c" stroke-width="2"/><text x="230" y="289" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">лист 1</text><rect x="14" y="373" width="872" height="277" rx="10" fill="#f8fafc" stroke="#dbe2ec"/><text x="28" y="401" font-size="20" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Шаг 2. Вставляем ba$</text><text x="28" y="428" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Первая буква другая: отдельное ребро из корня, лист 2.</text><path d="M450,504 L230,561" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="345.0" y="527.5" font-size="14" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">aba$</text><path d="M450,504 L600,561" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="530.0" y="527.5" font-size="14" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">ba$</text><rect x="411.0" y="465" width="78" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="450" y="490" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">корень</text><rect x="191.0" y="565" width="78" height="38" rx="7" fill="#dcfce7" stroke="#16803c" stroke-width="2"/><text x="230" y="590" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">лист 1</text><rect x="561.0" y="565" width="78" height="38" rx="7" fill="#dcfce7" stroke="#16803c" stroke-width="2"/><text x="600" y="590" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">лист 2</text><rect x="14" y="674" width="872" height="372" rx="10" fill="#f8fafc" stroke="#dbe2ec"/><text x="28" y="702" font-size="20" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Шаг 3. Вставляем a$</text><text x="28" y="729" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Общая первая a. Затем $ отличается от b: разбиваем старое ребро после a.</text><path d="M450,805 L250,852" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="355.0" y="823.5" font-size="14" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">a</text><path d="M250,895 L140,957" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="200.0" y="921.0" font-size="14" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">ba$</text><path d="M250,895 L350,957" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="305.0" y="921.0" font-size="14" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">$</text><path d="M450,805 L600,862" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="530.0" y="828.5" font-size="14" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">ba$</text><rect x="411.0" y="766" width="78" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="450" y="791" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">корень</text><rect x="221.0" y="856" width="58" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="250" y="881" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">a</text><rect x="101.0" y="961" width="78" height="38" rx="7" fill="#dcfce7" stroke="#16803c" stroke-width="2"/><text x="140" y="986" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">лист 1</text><rect x="311.0" y="961" width="78" height="38" rx="7" fill="#dcfce7" stroke="#16803c" stroke-width="2"/><text x="350" y="986" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">лист 3</text><rect x="561.0" y="866" width="78" height="38" rx="7" fill="#dcfce7" stroke="#16803c" stroke-width="2"/><text x="600" y="891" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">лист 2</text><rect x="14" y="1070" width="872" height="372" rx="10" fill="#f8fafc" stroke="#dbe2ec"/><text x="28" y="1098" font-size="20" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Шаг 4. Вставляем $</text><text x="28" y="1125" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Добавляем отдельный лист 4. Каждый суффикс теперь заканчивается своим листом.</text><path d="M450,1201 L250,1248" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="355.0" y="1219.5" font-size="14" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">a</text><pat