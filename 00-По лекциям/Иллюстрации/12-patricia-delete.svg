<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1126" viewBox="0 0 900 1126" role="img"><title>PATRICIA: удалить ключ 10, физически убрать узел 11</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#64748b"/></marker></defs><rect width="900" height="1126" fill="white"/><text x="28" y="37" font-size="23" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">PATRICIA: удалить ключ 10, физически убрать узел 11</text><rect x="14" y="72" width="872" height="412" rx="10" fill="#f8fafc" stroke="#dbe2ec"/><text x="28" y="100" font-size="20" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Шаг 1. До удаления</text><text x="28" y="127" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">X — узел 10 / b=1. Обратная ссылка к нему приходит из Q — узла 11 / b=2.</text><path d="M230,203 L480,260" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="360.0" y="226.5" font-size="14" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">старт</text><path d="M460,263 Q225.0,258.0 200,203" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="263.5" y="245.5" font-size="14" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">0</text><path d="M480,303 L690,395" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="590.0" y="344.0" font-size="14" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">1</text><path d="M670,398 Q455.0,375.5 450,303" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="493.5" y="363.0" font-size="14" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">0</text><path d="M712,403 C775,343 775,483 719,433" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="755" y="398" font-size="14" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">1</text><rect x="181.0" y="164" width="98" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="230" y="189" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">00 / b=0</text><rect x="431.0" y="264" width="98" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="480" y="289" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">10 / b=1</text><rect x="641.0" y="399" width="98" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="690" y="424" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">11 / b=2</text><rect x="14" y="508" width="872" height="293" rx="10" fill="#f8fafc" stroke="#dbe2ec"/><text x="28" y="536" font-size="20" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Шаг 2. Что переносим</text><text x="28" y="563" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Ключ 11 переносим в X, но проверяемый бит X остаётся 1. Ссылку Q на себя</text><text x="28" y="587" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">перенаправляем в X.</text><text x="32" y="640" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">X: ключ</text><rect x="168.0" y="615" width="44" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="190" y="640" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">10</text><rect x="217.0" y="615" width="44" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="239" y="640" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">→</text><rect x="266.0" y="615" width="44" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="288" y="640" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">11</text><text x="32" y="695" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">X: бит</text><rect x="168.0" y="670" width="44" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="190" y="695" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">1</text><rect x="217.0" y="670" width="44" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="239" y="695" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">→</text><rect x="266.0" y="670" width="44" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="288" y="695" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">1</text><text x="32" y="750" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Q: ключ</text><rect x="168.0" y="725" width="44" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="190" y="750" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">11</text><rect x="14" y="825" width="872" height="277" rx="10" fill="#f8fafc" stroke="#dbe2ec"/><text x="28" y="853" font-size="20" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Шаг 3. Исключаем физический узел Q</text><text x="28" y="880" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Правый указатель X теперь ведёт в сам X. Header и его стартовый переход сохранены.</text><path d="M230,956 L480,1013" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="360.0" y="979.5" font-size="14" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">старт</text><path d="M460,1016 Q225.0,1011.0 200,956" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="263.5" y="998.5" font-size="14" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">0</text><path d="M502,1021 C565,961 565,1101 509,1051" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="545" y="1016" font-size="14" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">1</text><rect x="181.0" y="917" width="98" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="230" y="942" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">00 / b=0</text><rect x="431.0" y="1017" width="98" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="480" y="1042" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">11 / b=1</text></svg>