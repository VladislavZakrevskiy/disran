<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1276" viewBox="0 0 900 1276" role="img"><title>Treap: split по ключу 4, результат &lt;4 и ≥4</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#64748b"/></marker></defs><rect width="900" height="1276" fill="white"/><text x="28" y="37" font-size="23" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Treap: split по ключу 4, результат &lt;4 и ≥4</text><rect x="14" y="72" width="872" height="312" rx="10" fill="#f8fafc" stroke="#dbe2ec"/><text x="28" y="100" font-size="20" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Шаг 1. Начальное дерево</text><text x="28" y="127" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">В каждой вершине ключ:приоритет. Приоритет родителя больше приоритетов детей.</text><path d="M237.5,273 L131.25,300" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M237.5,273 L343.75,300" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M450.0,203 L237.5,230" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M662.5,273 L556.25,300" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M450.0,203 L662.5,230" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="420.0" y="164" width="60" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="450.0" y="189" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">4:40</text><rect x="207.5" y="234" width="60" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="237.5" y="259" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">2:30</text><rect x="101.25" y="304" width="60" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="131.25" y="329" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">1:10</text><rect x="313.75" y="304" width="60" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="343.75" y="329" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">3:20</text><rect x="632.5" y="234" width="60" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="662.5" y="259" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">6:25</text><rect x="526.25" y="304" width="60" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="556.25" y="329" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">5:15</text><rect x="14" y="408" width="872" height="242" rx="10" fill="#f8fafc" stroke="#dbe2ec"/><text x="28" y="436" font-size="20" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Шаг 2. Корень 4 относится в правый результат</text><text x="28" y="463" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Делим его левое поддерево. В нём 2 &lt; 4, затем 3 &lt; 4: оба остаются слева.</text><path d="M450.0,539 L237.5,566" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M450.0,539 L662.5,566" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="420.0" y="500" width="60" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="450.0" y="525" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">2:30</text><rect x="207.5" y="570" width="60" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="237.5" y="595" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">1:10</text><rect x="632.5" y="570" width="60" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="662.5" y="595" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">3:20</text><rect x="14" y="674" width="872" height="242" rx="10" fill="#f8fafc" stroke="#dbe2ec"/><text x="28" y="702" font-size="20" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Шаг 3. Левый результат готов</text><text x="28" y="729" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Все ключи меньше 4. Это первое из двух отдельных деревьев.</text><path d="M450.0,805 L237.5,832" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M450.0,805 L662.5,832" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="420.0" y="766" width="60" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="450.0" y="791" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">2:30</text><rect x="207.5" y="836" width="60" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="237.5" y="861" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">1:10</text><rect x="632.5" y="836" width="60" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="662.5" y="861" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">3:20</text><rect x="14" y="940" width="872" height="312" rx="10" fill="#f8fafc" stroke="#dbe2ec"/><text x="28" y="968" font-size="20" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Шаг 4. Правый результат готов</text><text x="28" y="995" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Левая ссылка 4 теперь пуста; правая ветвь 6 не изменилась.</text><path d="M662.5,1141 L556.25,1168" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M450.0,1071 L662.5,1098" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="420.0" y="1032" width="60" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="450.0" y="1057" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">4:40</text><rect x="632.5" y="1102" width="60" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="662.5" y="1127" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">6:25</text><rect x="526.25" y="1172" width="60" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="556.25" y="1197" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">5:15</text></svg>