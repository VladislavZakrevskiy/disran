<svg xmlns="http://www.w3.org/2000/svg" width="900" height="989" viewBox="0 0 900 989" role="img"><title>Два текста: один путь, несколько номеров в листе</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#64748b"/></marker></defs><rect width="900" height="989" fill="white"/><text x="28" y="37" font-size="23" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Два текста: один путь, несколько номеров в листе</text><rect x="14" y="72" width="872" height="269" rx="10" fill="#f8fafc" stroke="#dbe2ec"/><text x="28" y="100" font-size="20" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Шаг 1. Тексты cab и dab</text><text x="28" y="127" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Ищем общую подстроку. Сначала выписываем нужные суффиксы с позиции 2.</text><text x="32" y="180" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Текст 1</text><rect x="168.0" y="155" width="44" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="190" y="180" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">c</text><rect x="217.0" y="155" width="44" height="38" rx="7" fill="#dcfce7" stroke="#16803c" stroke-width="2"/><text x="239" y="180" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">a</text><rect x="266.0" y="155" width="44" height="38" rx="7" fill="#dcfce7" stroke="#16803c" stroke-width="2"/><text x="288" y="180" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">b</text><text x="32" y="235" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Текст 2</text><rect x="168.0" y="210" width="44" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="190" y="235" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">d</text><rect x="217.0" y="210" width="44" height="38" rx="7" fill="#dcfce7" stroke="#16803c" stroke-width="2"/><text x="239" y="235" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">a</text><rect x="266.0" y="210" width="44" height="38" rx="7" fill="#dcfce7" stroke="#16803c" stroke-width="2"/><text x="288" y="235" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">b</text><text x="32" y="290" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Суффиксы</text><rect x="166.5" y="265" width="47" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="190" y="290" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">ab$</text><rect x="218.5" y="265" width="47" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="242" y="290" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">ab$</text><rect x="14" y="365" width="872" height="307" rx="10" fill="#f8fafc" stroke="#dbe2ec"/><text x="28" y="393" font-size="20" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Шаг 2. Одинаковые суффиксы используют один лист</text><text x="28" y="420" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Показан только фрагмент общего дерева. В листе храним обе пары: (текст, начало).</text><path d="M450,496 L450,583" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="455.0" y="534.5" font-size="14" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">ab$</text><rect x="411.0" y="457" width="78" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="450" y="482" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">корень</text><rect x="381.0" y="587" width="138" height="38" rx="7" fill="#dcfce7" stroke="#16803c" stroke-width="2"/><text x="450" y="612" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">(1,2); (2,2)</text><rect x="14" y="696" width="872" height="269" rx="10" fill="#f8fafc" stroke="#dbe2ec"/><text x="28" y="724" font-size="20" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Шаг 3. Запрос ab заканчивается до служебного $</text><text x="28" y="751" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Из листа получаем оба ответа. Для общей подстроки длина до $ равна 2.</text><text x="32" y="804" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Путь</text><rect x="168.0" y="779" width="44" height="38" rx="7" fill="#dcfce7" stroke="#16803c" stroke-width="2"/><text x="190" y="804" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">a</text><rect x="217.0" y="779" width="44" height="38" rx="7" fill="#dcfce7" stroke="#16803c" stroke-width="2"/><text x="239" y="804" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">b</text><rect x="266.0" y="779" width="44" height="38" rx="7" fill="#fef3c7" stroke="#a16207" stroke-width="2"/><text x="288" y="804" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">$</text><text x="32" y="859" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Запрос</text><rect x="168.0" y="834" width="44" height="38" rx="7" fill="#dcfce7" stroke="#16803c" stroke-width="2"/><text x="190" y="859" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">a</text><rect x="217.0" y="834" width="44" height="38" rx="7" fill="#dcfce7" stroke="#16803c" stroke-width="2"/><text x="239" y="859" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">b</text><text x="32" y="914" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Ответы</text><rect x="155.5" y="889" width="69" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="190" y="914" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">(1,2)</text><rect x="229.5" y="889" width="69" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="264" y="914" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">(2,2)</text></svg>