<svg xmlns="http://www.w3.org/2000/svg" width="900" height="744" viewBox="0 0 900 744" role="img"><title>Левый поворот: среднее поддерево переезжает вместе со ссылкой</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#64748b"/></marker></defs><rect width="900" height="744" fill="white"/><text x="28" y="37" font-size="23" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Левый поворот: среднее поддерево переезжает вместе со ссылкой</text><rect x="14" y="72" width="872" height="312" rx="10" fill="#f8fafc" stroke="#dbe2ec"/><text x="28" y="100" font-size="20" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Шаг 1. До поворота вокруг 10</text><text x="28" y="127" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">20 поднимется вверх. Ключ 15 больше 10, но меньше 20.</text><path d="M450.0,203 L237.5,230" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M662.5,273 L556.25,300" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M662.5,273 L768.75,300" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M450.0,203 L662.5,230" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="421.0" y="164" width="58" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="450.0" y="189" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">10</text><rect x="208.5" y="234" width="58" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="237.5" y="259" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">5</text><rect x="633.5" y="234" width="58" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="662.5" y="259" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">20</text><rect x="527.25" y="304" width="58" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="556.25" y="329" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">15</text><rect x="739.75" y="304" width="58" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="768.75" y="329" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">25</text><rect x="14" y="408" width="872" height="312" rx="10" fill="#f8fafc" stroke="#dbe2ec"/><text x="28" y="436" font-size="20" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Шаг 2. После поворота</text><text x="28" y="463" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">20 стал корнем; 10 — его левым ребёнком; 15 теперь правый ребёнок 10.</text><path d="M237.5,609 L131.25,636" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M237.5,609 L343.75,636" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M450.0,539 L237.5,566" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M450.0,539 L662.5,566" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="421.0" y="500" width="58" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="450.0" y="525" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">20</text><rect x="208.5" y="570" width="58" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="237.5" y="595" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">10</text><rect x="102.25" y="640" width="58" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="131.25" y="665" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">5</text><rect x="314.75" y="640" width="58" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><t