<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1080" viewBox="0 0 900 1080" role="img"><title>BST: поиск места и вставка ключа 6</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#64748b"/></marker></defs><rect width="900" height="1080" fill="white"/><text x="28" y="37" font-size="23" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">BST: поиск места и вставка ключа 6</text><rect x="14" y="72" width="872" height="312" rx="10" fill="#f8fafc" stroke="#dbe2ec"/><text x="28" y="100" font-size="20" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Шаг 1. Начинаем в корне 8</text><text x="28" y="127" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">6 &lt; 8, поэтому переходим в левое поддерево.</text><path d="M237.5,273 L131.25,300" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M450.0,203 L237.5,230" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M450.0,203 L662.5,230" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="421.0" y="164" width="58" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="450.0" y="189" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">8</text><rect x="208.5" y="234" width="58" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="237.5" y="259" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">3</text><rect x="102.25" y="304" width="58" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="131.25" y="329" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">1</text><rect x="633.5" y="234" width="58" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="662.5" y="259" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">10</text><rect x="14" y="408" width="872" height="312" rx="10" fill="#f8fafc" stroke="#dbe2ec"/><text x="28" y="436" font-size="20" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Шаг 2. Пришли в 3</text><text x="28" y="463" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">6 &gt; 3. Справа пусто: именно здесь должен появиться новый ключ.</text><path d="M237.5,609 L131.25,636" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M237.5,609 L343.75,636" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M450.0,539 L237.5,566" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M450.0,539 L662.5,566" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="421.0" y="500" width="58" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="450.0" y="525" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">8</text><rect x="208.5" y="570" width="58" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="237.5" y="595" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">3</text><rect x="102.25" y="640" width="58" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="131.25" y="665" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">1</text><rect x="308.25" y="640" width="71" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="343.75" y="665" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">пусто</text><rect x="633.5" y="570" width="58" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="662.5" y="595" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">10</text><rect x="14" y="744" width="872" height="312" rx="10" fill="#f8fafc" stroke="#dbe2ec"/><text x="28" y="772" font-size="20" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Шаг 3. Ставим новый лист</text><text x="28" y="799" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">6 находится между 3 и 8, поэтому порядок BST сохранён.</text><path d="M237.5,945 L131.25,972" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M237.5,945 L343.75,972" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M450.0,875 L237.5,902" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M450.0,875 L662.5,902" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="421.0" y="836" width="58" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="450.0" y="861" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">8</text><rect x="208.5" y="906" width="58" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="237.5" y="931" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">3</text><rect x="102.25" y="976" width="58" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="131.25" y="1001" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">1</text><rect x="314.75" y="976" width="58" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="343.75" y="1001" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">6</text><rect x="633.5" y="906" width="58" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="662.5" y="931" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">10</text></svg>