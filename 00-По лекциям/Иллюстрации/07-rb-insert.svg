<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1808" viewBox="0 0 900 1808" role="img"><title>КЧ-вставка: сначала поворот, затем случай красного дяди</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#64748b"/></marker></defs><rect width="900" height="1808" fill="white"/><text x="28" y="37" font-size="23" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">КЧ-вставка: сначала поворот, затем случай красного дяди</text><rect x="14" y="72" width="872" height="172" rx="10" fill="#f8fafc" stroke="#dbe2ec"/><text x="28" y="100" font-size="20" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Шаг 1. Вставили 10</text><text x="28" y="127" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Первый узел становится корнем и окрашивается в чёрный.</text><rect x="421.0" y="164" width="58" height="38" rx="7" fill="#243247" stroke="#243247" stroke-width="2"/><text x="450.0" y="189" font-size="17" fill="white" text-anchor="middle" font-family="monospace">10Ч</text><rect x="14" y="268" width="872" height="242" rx="10" fill="#f8fafc" stroke="#dbe2ec"/><text x="28" y="296" font-size="20" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Шаг 2. Вставили 5</text><text x="28" y="323" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Новый узел красный. Его родитель 10 чёрный — нарушения нет.</text><path d="M450.0,399 L237.5,426" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="421.0" y="360" width="58" height="38" rx="7" fill="#243247" stroke="#243247" stroke-width="2"/><text x="450.0" y="385" font-size="17" fill="white" text-anchor="middle" font-family="monospace">10Ч</text><rect x="208.5" y="430" width="58" height="38" rx="7" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/><text x="237.5" y="455" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">5К</text><rect x="14" y="534" width="872" height="312" rx="10" fill="#f8fafc" stroke="#dbe2ec"/><text x="28" y="562" font-size="20" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Шаг 3. Вставили 1</text><text x="28" y="589" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Получились соседние красные 5 и 1; дядя справа — чёрный NIL.</text><path d="M237.5,735 L131.25,762" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M450.0,665 L237.5,692" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="421.0" y="626" width="58" height="38" rx="7" fill="#243247" stroke="#243247" stroke-width="2"/><text x="450.0" y="651" font-size="17" fill="white" text-anchor="middle" font-family="monospace">10Ч</text><rect x="208.5" y="696" width="58" height="38" rx="7" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/><text x="237.5" y="721" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">5К</text><rect x="102.25" y="766" width="58" height="38" rx="7" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/><text x="131.25" y="791" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">1К</text><rect x="14" y="870" width="872" height="242" rx="10" fill="#f8fafc" stroke="#dbe2ec"/><text x="28" y="898" font-size="20" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Шаг 4. Правый поворот и смена цветов</text><text x="28" y="925" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">5 поднимается и становится чёрным; 10 становится красным.</text><path d="M450.0,1001 L237.5,1028" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M450.0,1001 L662.5,1028" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="421.0" y="962" width="58" height="38" rx="7" fill="#243247" stroke="#243247" stroke-width="2"/><text x="450.0" y="987" font-size="17" fill="white" text-anchor="middle" font-family="monospace">5Ч</text><rect x="208.5" y="1032" width="58" height="38" rx="7" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/><text x="237.5" y="1057" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">1К</text><rect x="633.5" y="1032" width="58" height="38" rx="7" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/><text x="662.5" y="1057" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">10К</text><rect x="14" y="1136" width="872" height="312" rx="10" fill="#f8fafc" stroke="#dbe2ec"/><text x="28" y="1164" font-size="20" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Шаг 5. Вставили 15</text><text x="28" y="1191" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Родитель 10 красный; дядя 1 тоже красный.</text><path d="M450.0,1267 L237.5,1294" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M662.5,1337 L768.75,1364" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M450.0,1267 L662.5,1294" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="421.0" y="1228" width="58" height="38" rx="7" fill="#243247" stroke="#243247" stroke-width="2"/><text x="450.0" y="1253" font-size="17" fill="white" text-anchor="middle" font-family="monospace">5Ч</text><rect x="208.5" y="1298" width="58" height="38" rx="7" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/><text x="237.5" y="1323" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">1К</text><rect x="633.5" y="1298" width="58" height="38" rx="7" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/><text x="662.5" y="1323" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">10К</text><rect x="739.75" y="1368" width="58" height="38" rx="7" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/><text x="768.75" y="1393" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">15К</text><rect x="14" y="1472" width="872" height="312" rx="10" fill="#f8fafc" stroke="#dbe2ec"/><text x="28" y="1500" font-size="20" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Шаг 6. Перекрашиваем родителя и дядю</text><text x="28" y="1527" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">1 и 10 становятся чёрными. Корень 5 оставляем чёрным; 15 остаётся красным.</text><path d="M450.0,1603 L237.5,1630" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M662.5,1673 L768.75,1700" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M450.0,1603 L662.5,1630" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="421.0" y="1564" width="58" height="38" rx="7" fill="#243247" stroke="#243247" stroke-width="2"/><text x="450.0" y="1589" font-size="17" fill="white" text-anchor="middle" font-family="monospace">5Ч</text><rect x="208.5" y="1634" width="58" height="38" rx="7" fill="#243247" stroke="#243247" stroke-width="2"/><text x="237.5" y="1659" font-size="17" fill="white" text-anchor="middle" font-family="monospace">1Ч</text><rect x="633.5" y="1634" width="58" height="38" rx="7" fill="#243247" stroke="#243247" stroke-width="2"/><text x="662.5" y="1659" font-size="17" fill="white" text-anchor="middle" font-family="monospace">10Ч</text><rect x="739.75" y="1704" width="58" height="38" rx="7" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/><text x="768.75" y="1729" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">15К</text></svg>