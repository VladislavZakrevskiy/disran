<svg xmlns="http://www.w3.org/2000/svg" width="900" height="859" viewBox="0 0 900 859" role="img"><title>Вставки: место для нового элемента внутри готового префикса</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#64748b"/></marker></defs><rect width="900" height="859" fill="white"/><text x="28" y="37" font-size="23" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Вставки: место для нового элемента внутри готового префикса</text><rect x="14" y="72" width="872" height="159" rx="10" fill="#f8fafc" stroke="#dbe2ec"/><text x="28" y="100" font-size="20" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Шаг 1. Начало</text><text x="28" y="127" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">В массиве [5,1,9] первый элемент уже считается отсортированным.</text><text x="32" y="180" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Массив</text><rect x="168.0" y="155" width="44" height="38" rx="7" fill="#dcfce7" stroke="#16803c" stroke-width="2"/><text x="190" y="180" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">5</text><rect x="217.0" y="155" width="44" height="38" rx="7" fill="#fef3c7" stroke="#a16207" stroke-width="2"/><text x="239" y="180" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">1</text><rect x="266.0" y="155" width="44" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="288" y="180" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">9</text><rect x="14" y="255" width="872" height="214" rx="10" fill="#f8fafc" stroke="#dbe2ec"/><text x="28" y="283" font-size="20" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Шаг 2. Сохраняем 1; сдвигаем 5 вправо</text><text x="28" y="310" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">1 меньше 5. Освободившаяся первая позиция обозначена точкой.</text><text x="32" y="363" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Массив</text><rect x="168.0" y="338" width="44" height="38" rx="7" fill="#fef3c7" stroke="#a16207" stroke-width="2"/><text x="190" y="363" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">·</text><rect x="217.0" y="338" width="44" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="239" y="363" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">5</text><rect x="266.0" y="338" width="44" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="288" y="363" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">9</text><text x="32" y="418" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">В руке</text><rect x="168.0" y="393" width="44" height="38" rx="7" fill="#fef3c7" stroke="#a16207" stroke-width="2"/><text x="190" y="418" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">1</text><rect x="14" y="493" width="872" height="159" rx="10" fill="#f8fafc" stroke="#dbe2ec"/><text x="28" y="521" font-size="20" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Шаг 3. Ставим 1 в освободившееся место</text><text x="28" y="548" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Префикс из двух элементов теперь отсортирован.</text><text x="32" y="601" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Массив</text><rect x="168.0" y="576" width="44" height="38" rx="7" fill="#dcfce7" stroke="#16803c" stroke-width="2"/><text x="190" y="601" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">1</text><rect x="217.0" y="576" width="44" height="38" rx="7" fill="#dcfce7" stroke="#16803c" stroke-width="2"/><text x="239" y="601" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">5</text><rect x="266.0" y="576" width="44" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="288" y="601" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">9</text><rect x="14" y="676" width="872" height="159" rx="10" fill="#f8fafc" stroke="#dbe2ec"/><text x="28" y="704" font-size="20" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Шаг 4. Проверяем 9</text><text x="28" y="731" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">9 больше 5. Ничего не сдвигаем: весь массив уже отсортирован.</text><text x="32" y="784" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Массив</text><rect x="168.0" y="759" width="44" height="38" rx="7" fill="#dcfce7" stroke="#16803c" stroke-width="2"/><text x="190" y="784" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">1</text><rect x="217.0" y="759" width="44" height="38" rx="7" fill="#dcfce7" stroke="#16803c" stroke-width="2"/><text x="239" y="784" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">5</text><rect x="266.0" y="759" width="44" height="38" rx="7" fill="#dcfce7" stroke="#16803c" stroke-width="2"/><text x="288" y="784" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">9</text></svg>