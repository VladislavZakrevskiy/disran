<svg xmlns="http://www.w3.org/2000/svg" width="900" height="731" viewBox="0 0 900 731" role="img"><title>MSD: после старшего разряда работаем внутри отдельных блоков</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#64748b"/></marker></defs><rect width="900" height="731" fill="white"/><text x="28" y="37" font-size="23" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">MSD: после старшего разряда работаем внутри отдельных блоков</text><rect x="14" y="72" width="872" height="214" rx="10" fill="#f8fafc" stroke="#dbe2ec"/><text x="28" y="100" font-size="20" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Шаг 1. Делим по десяткам</text><text x="28" y="127" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Исходный порядок [21,12,11,22]. Все числа с десятком 1 идут перед десятком 2.</text><text x="32" y="180" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Блок 1</text><rect x="168.0" y="155" width="44" height="38" rx="7" fill="#fef3c7" stroke="#a16207" stroke-width="2"/><text x="190" y="180" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">12</text><rect x="217.0" y="155" width="44" height="38" rx="7" fill="#fef3c7" stroke="#a16207" stroke-width="2"/><text x="239" y="180" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">11</text><text x="32" y="235" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Блок 2</text><rect x="168.0" y="210" width="44" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="190" y="235" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">21</text><rect x="217.0" y="210" width="44" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="239" y="235" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">22</text><rect x="14" y="310" width="872" height="214" rx="10" fill="#f8fafc" stroke="#dbe2ec"/><text x="28" y="338" font-size="20" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Шаг 2. В первом блоке сортируем единицы</text><text x="28" y="365" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Меняем 12 и 11 местами. Второй блок уже упорядочен.</text><text x="32" y="418" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Блок 1</text><rect x="168.0" y="393" width="44" height="38" rx="7" fill="#dcfce7" stroke="#16803c" stroke-width="2"/><text x="190" y="418" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">11</text><rect x="217.0" y="393" width="44" height="38" rx="7" fill="#dcfce7" stroke="#16803c" stroke-width="2"/><text x="239" y="418" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">12</text><text x="32" y="473" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Блок 2</text><rect x="168.0" y="448" width="44" height="38" rx="7" fill="#dcfce7" stroke="#16803c" stroke-width="2"/><text x="190" y="473" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">21</text><rect x="217.0" y="448" width="44" height="38" rx="7" fill="#dcfce7" stroke="#16803c" stroke-width="2"/><text x="239" y="473" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">22</text><rect x="14" y="548" width="872" height="159" rx="10" fill="#f8fafc" stroke="#dbe2ec"/><text x="28" y="576" font-size="20" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Шаг 3. Склеиваем блоки</text><text x="28" y="603" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Границы старших разрядов больше не нарушаем.</text><text x="32" y="656" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Ответ</text><rect x="168.0" y="631" width="44" height="38" rx="7" fill="#dcfce7" stroke="#16803c" stroke-width="2"/><text x="190" y="656" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">11</text><rect x="217.0" y="631" width="44" height="38" rx="7" fill="#dcfce7" stroke="#16803c" stroke-width="2"/><text x="239" y="656" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">12</text><rect x="266.0" y="631" width="44" height="38" rx="7" fill="#dcfce7" stroke="#16803c" stroke-width="2"/><text x="288" y="656" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">21</text><rect x="315.0" y="631" width="44" height="38" rx="7" fill="#dcfce7" stroke="#16803c" stroke-width="2"/><text x="337" y="656" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">22</text></svg>