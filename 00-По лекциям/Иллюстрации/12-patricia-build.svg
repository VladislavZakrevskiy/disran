<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1058" viewBox="0 0 900 1058" role="img"><title>PATRICIA: три ключа, две различающие позиции</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#64748b"/></marker></defs><rect width="900" height="1058" fill="white"/><text x="28" y="37" font-size="23" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">PATRICIA: три ключа, две различающие позиции</text><rect x="14" y="72" width="872" height="177" rx="10" fill="#f8fafc" stroke="#dbe2ec"/><text x="28" y="100" font-size="20" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Шаг 1. Вставляем первый ключ 00</text><text x="28" y="127" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Header содержит ключ 00 и служебный номер бита 0. Единственная ссылка — на себя.</text><path d="M252,168 C315,108 315,248 259,198" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="295" y="163" font-size="14" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">старт</text><rect x="181.0" y="164" width="98" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="230" y="189" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">00 / b=0</text><rect x="14" y="273" width="872" height="301" rx="10" fill="#f8fafc" stroke="#dbe2ec"/><text x="28" y="301" font-size="20" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Шаг 2. Вставляем 10</text><text x="28" y="328" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Поиск дал кандидата 00. Первое отличие — бит 1. Узел 10 проверяет этот бит: 0</text><text x="28" y="352" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">ведёт к 00, 1 — к себе.</text><path d="M230,428 L480,485" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="360.0" y="451.5" font-size="14" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">старт</text><path d="M460,488 Q225.0,483.0 200,428" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="263.5" y="470.5" font-size="14" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">0</text><path d="M502,493 C565,433 565,573 509,523" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="545" y="488" font-size="14" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">1</text><rect x="181.0" y="389" width="98" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="230" y="414" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">00 / b=0</text><rect x="431.0" y="489" width="98" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="480" y="514" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">10 / b=1</text><rect x="14" y="598" width="872" height="436" rx="10" fill="#f8fafc" stroke="#dbe2ec"/><text x="28" y="626" font-size="20" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Шаг 3. Вставляем 11</text><text x="28" y="653" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Поиск дал кандидата 10. Отличается бит 2. Разрезаем прежнюю правую самоссылку 10 и</text><text x="28" y="677" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">вставляем узел 11.</text><path d="M230,753 L480,810" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="360.0" y="776.5" font-size="14" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">старт</text><path d="M460,813 Q225.0,808.0 200,753" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="263.5" y="795.5" font-size="14" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">0</text><path d="M480,853 L690,945" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="590.0" y="894.0" font-size="14" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">1</text><path d="M670,948 Q455.0,925.5 450,853" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="493.5" y="913.0" font-size="14" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">0</text><path d="M712,953 C775,893 775,1033 719,983" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="755" y="948" font-size="14" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">1</text><rect x="181.0" y="714" width="98" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="230" y="739" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">00 / b=0</text><rect x="431.0" y="814" width="98" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="480" y="839" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">10 / b=1</text><rect x="641.0" y="949" width="98" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="690" y="974" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">11 / b=2</text></svg>