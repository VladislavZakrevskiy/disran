<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1024" viewBox="0 0 900 1024" role="img"><title>Подсчёт частот: индекс — число, значение — количество</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#64748b"/></marker></defs><rect width="900" height="1024" fill="white"/><text x="28" y="37" font-size="23" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Подсчёт частот: индекс — число, значение — количество</text><rect x="14" y="72" width="872" height="269" rx="10" fill="#f8fafc" stroke="#dbe2ec"/><text x="28" y="100" font-size="20" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Шаг 1. Нули в счётчиках</text><text x="28" y="127" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Вход [2,1,2,0]; возможны ключи 0, 1 и 2.</text><text x="32" y="180" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Вход</text><rect x="168.0" y="155" width="44" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="190" y="180" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">2</text><rect x="217.0" y="155" width="44" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="239" y="180" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">1</text><rect x="266.0" y="155" width="44" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="288" y="180" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">2</text><rect x="315.0" y="155" width="44" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="337" y="180" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">0</text><text x="32" y="235" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Ключ x</text><rect x="168.0" y="210" width="44" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="190" y="235" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">0</text><rect x="217.0" y="210" width="44" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="239" y="235" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">1</text><rect x="266.0" y="210" width="44" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="288" y="235" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">2</text><text x="32" y="290" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">count</text><rect x="168.0" y="265" width="44" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="190" y="290" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">0</text><rect x="217.0" y="265" width="44" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="239" y="290" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">0</text><rect x="266.0" y="265" width="44" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="288" y="290" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">0</text><rect x="14" y="365" width="872" height="214" rx="10" fill="#f8fafc" stroke="#dbe2ec"/><text x="28" y="393" font-size="20" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Шаг 2. Читаем 2, затем 1</text><text x="28" y="420" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Увеличиваем только счётчик прочитанного ключа.</text><text x="32" y="473" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">После 2</text><rect x="168.0" y="448" width="44" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="190" y="473" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">0</text><rect x="217.0" y="448" width="44" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="239" y="473" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">0</text><rect x="266.0" y="448" width="44" height="38" rx="7" fill="#fef3c7" stroke="#a16207" stroke-width="2"/><text x="288" y="473" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">1</text><text x="32" y="528" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">После 1</text><rect x="168.0" y="503" width="44" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="190" y="528" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">0</text><rect x="217.0" y="503" width="44" height="38" rx="7" fill="#fef3c7" stroke="#a16207" stroke-width="2"/><text x="239" y="528" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">1</text><rect x="266.0" y="503" width="44" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="288" y="528" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">1</text><rect x="14" y="603" width="872" height="214" rx="10" fill="#f8fafc" stroke="#dbe2ec"/><text x="28" y="631" font-size="20" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Шаг 3. Читаем вторую 2, затем 0</text><text x="28" y="658" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Получены все частоты: один ноль, одна единица, две двойки.</text><text x="32" y="711" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">После 2</text><rect x="168.0" y="686" width="44" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="190" y="711" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">0</text><rect x="217.0" y="686" width="44" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="239" y="711" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">1</text><rect x="266.0" y="686" width="44" height="38" rx="7" fill="#fef3c7" stroke="#a16207" stroke-width="2"/><text x="288" y="711" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">2</text><text x="32" y="766" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">После 0</text><rect x="168.0" y="741" width="44" height="38" rx="7" fill="#fef3c7" stroke="#a16207" stroke-width="2"/><text x="190" y="766" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">1</text><rect x="217.0" y="741" width="44" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="239" y="766" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">1</text><rect x="266.0" y="741" width="44" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="288" y="766" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">2</text><rect x="14" y="841" width="872" height="159" rx="10" fill="#f8fafc" stroke="#dbe2ec"/><text x="28" y="869" font-size="20" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Шаг 4. Выписываем ключи по возрастанию</text><text x="28" y="896" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Ноль — один раз, единицу — один раз, двойку — два раза.</text><text x="32" y="949" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Ответ</text><rect x="168.0" y="924" width="44" height="38" rx="7" fill="#dcfce7" stroke="#16803c" stroke-width="2"/><text x="190" y="949" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">0</text><rect x="217.0" y="924" width="44" height="38" rx="7" fill="#dcfce7" stroke="#16803c" stroke-width="2"/><text x="239" y="949" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">1</text><rect x="266.0" y="924" width="44" height="38" rx="7" fill="#dcfce7" stroke="#16803c" stroke-width="2"/><text x="288" y="949" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">2</text><rect x="315.0" y="924" width="44" height="38" rx="7" fill="#dcfce7" stroke="#16803c" stroke-width="2"/><text x="337" y="949" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">2</text></svg>