 height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="337" y="290" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">?</text><rect x="364.0" y="265" width="44" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="386" y="290" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">?</text><rect x="14" y="365" width="872" height="214" rx="10" fill="#f8fafc" stroke="#dbe2ec"/><text x="28" y="393" font-size="20" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Шаг 2. k = 4: переносим готовый ноль</text><text x="28" y="420" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">k′ = 4 − 3 + 1 = 2; Z₂ = 0 &lt; 2. Новых сравнений нет.</text><text x="32" y="473" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">T</text><rect x="168.0" y="448" width="44" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="190" y="473" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">a</text><rect x="217.0" y="448" width="44" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="239" y="473" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">b</text><rect x="266.0" y="448" width="44" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="288" y="473" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">a</text><rect x="315.0" y="448" width="44" height="38" rx="7" fill="#fef3c7" stroke="#a16207" stroke-width="2"/><text x="337" y="473" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">b</text><rect x="364.0" y="448" width="44" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="386" y="473" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">a</text><text x="32" y="528" font-size="16" fill="#172235" text-anchor