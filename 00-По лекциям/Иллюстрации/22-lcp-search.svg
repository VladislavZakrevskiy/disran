<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1134" viewBox="0 0 900 1134" role="img"><title>Ищем bac: границы поиска и сравниваемые буквы</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#64748b"/></marker></defs><rect width="900" height="1134" fill="white"/><text x="28" y="37" font-size="23" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Ищем bac: границы поиска и сравниваемые буквы</text><rect x="14" y="72" width="872" height="269" rx="10" fill="#f8fafc" stroke="#dbe2ec"/><text x="28" y="100" font-size="20" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Шаг 1. Границы L=1, R=7; середина M=4</text><text x="28" y="127" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Крайние строки a и caba дают l=r=0. Середина acaba меньше bac: L ← 4.</text><text x="32" y="180" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">SA</text><rect x="168.0" y="155" width="44" height="38" rx="7" fill="#fef3c7" stroke="#a16207" stroke-width="2"/><text x="190" y="180" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">7</text><rect x="217.0" y="155" width="44" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="239" y="180" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">5</text><rect x="266.0" y="155" width="44" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="288" y="180" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">1</text><rect x="315.0" y="155" width="44" height="38" rx="7" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/><text x="337" y="180" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">3</text><rect x="364.0" y="155" width="44" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-wid