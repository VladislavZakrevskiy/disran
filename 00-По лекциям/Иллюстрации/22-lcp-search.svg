t" font-family="Arial, sans-serif">LCP(5,6)=2=l. Жёлтые ba не сравниваем заново; проверяем только c.</text><text x="32" y="766" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Суффикс</text><rect x="168.0" y="741" width="44" height="38" rx="7" fill="#fef3c7" stroke="#a16207" stroke-width="2"/><text x="190" y="766" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">b</text><rect x="217.0" y="741" width="44" height="38" rx="7" fill="#fef3c7" stroke="#a16207" stroke-width="2"/><text x="239" y="766" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">a</text><rect x="266.0" y="741" width="44" height="38" rx="7" fill="#dcfce7" stroke="#16803c" stroke-width="2"/><text x="288" y="766" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">c</text><rect x="315.0" y="741" width="44" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="337" y="766" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">a</text><rect x="364.0" y="741" width="44" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="386" y="766" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">b</text><rect x="413.0" y="741" width="44" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="435" y="766" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">a</text><text x="32" y="821" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Образец</text><rect x="168.0" y="796" width="44" height="38" rx="7" fill="#fef3c7" stroke="#a16207" stroke-width="2"/><text x="190" y="821" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">b</text><rect x="217.0" y="796" width="44" height="38" rx="7" fill="#fef3c7" stroke="#a16207" stroke-width="2"/><text x="239" y="821" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">a</text><rect x="266.0" y="796" width="44" height="38" rx="7" fill="#dcfce7" stroke="#16803c" stroke-width="2"/><text x="288" y="821" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">c</text><rect x="14" y="896" width="872" height="214" rx="10" fill="#f8fafc" stroke="#dbe2ec"/><text x="28" y="924" font-size="20" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Шаг 4. Найдено: SA[6] = 2</text><text x="28" y="951" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Образец кончился. Возвращаем 2 — начало в тексте, а не место 6 в массиве.</text><text x="32" y="1004" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Текст</text><rect x="168.0" y="979" width="44" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="190" y="1004" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">a</text><rect x="217.0" y="979" width="44" height="38" rx="7" fill="#dcfce7" stroke="#16803c" stroke-width="2"/><text x="239" y="1004" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">b</text><rect x="266.0" y="979" width="44" height="38" rx="7" fill="#dcfce7" stroke="#16803c" stroke-width="2"/><text x="288" y="1004" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">a</text><rect x="315.0" y="979" width="44" height="38" rx="7" fill="#dcfce7" stroke="#16803c" stroke-width="2"/><text x="337" y="1004" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">c</text><rect x="364.0" y="979" width="44" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="386" y="1004" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">a</text><rect x="413.0" y="979" width="44" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="435" y="1004" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">b</te