monospace">b</text><rect x="217.0" y="265" width="44" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="239" y="290" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">a</text><rect x="266.0" y="265" width="44" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="288" y="290" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">c</text><rect x="14" y="365" width="872" height="269" rx="10" fill="#f8fafc" stroke="#dbe2ec"/><text x="28" y="393" font-size="20" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Шаг 2. Теперь [4,7]; середина M=5</text><text x="28" y="420" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Суффикс ba закончился после двух совпадений: ba &lt; bac. L ← 5, l ← 2.</text><text x="32" y="473" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">SA</text><rect x="168.0" y="448" width="44" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="190" y="473" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">7</text><rect x="217.0" y="448" width="44" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="239" y="473" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">5</text><rect x="266.0" y="448" width="44" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="288" y="473" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">1</text><rect x="315.0" y="448" width="44" height="38" rx="7" fill="#fef3c7" stroke="#a16207" stroke-width="2"/><text x="337" y="473" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">3</text><rect x="364.0" y="448" width="44" height="38" rx="7" fill="#dcfce7" stroke="#16803c" stroke-width="2"/><text x="386" y="473" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">6</