<svg xmlns="http://www.w3.org/2000/svg" width="900" height="2326" viewBox="0 0 900 2326" role="img"><title>B-дерево: заимствование, слияние и уменьшение высоты</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#64748b"/></marker></defs><rect width="900" height="2326" fill="white"/><text x="28" y="37" font-size="23" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">B-дерево: заимствование, слияние и уменьшение высоты</text><rect x="14" y="72" width="872" height="242" rx="10" fill="#f8fafc" stroke="#dbe2ec"/><text x="28" y="100" font-size="20" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Шаг 1. Начинаем с результата вставок</text><text x="28" y="127" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Далее последовательно удаляем 3, 1, 6 и 2.</text><path d="M450.0,203 L166.66666666666666,230" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M450.0,203 L450.0,230" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M450.0,203 L733.3333333333333,230" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="414.5" y="164" width="71" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="450.0" y="189" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">2 | 4</text><rect x="137.66666666666666" y="234" width="58" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="166.66666666666666" y="259" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">1</text><rect x="421.0" y="234" width="58" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="450.0" y="259" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">3</text><rect x="697.8333333333333" y="234" width="71" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="733.3333333333333" y="259" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">5 | 6</text><rect x="14" y="338" width="872" height="242" rx="10" fill="#f8fafc" stroke="#dbe2ec"/><text x="28" y="366" font-size="20" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Шаг 2. Перед удалением 3 заимствуем справа</text><text x="28" y="393" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">У [3] минимум ключей. 4 из родителя опускается к нему, 5 из брата поднимается.</text><path d="M450.0,469 L166.66666666666666,496" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M450.0,469 L450.0,496" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M450.0,469 L733.3333333333333,496" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="414.5" y="430" width="71" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="450.0" y="455" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">2 | 5</text><rect x="137.66666666666666" y="500" width="58" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="166.66666666666666" y="525" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">1</text><rect x="414.5" y="500" width="71" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="450.0" y="525" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">3 | 4</text><rect x="704.3333333333333" y="500" width="58" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="733.3333333333333" y="525" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">6</text><rect x="14" y="604" width="872" height="242" rx="10" fill="#f8fafc" stroke="#dbe2ec"/><text x="28" y="632" font-size="20" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Шаг 3. Теперь удаляем 3 из листа</text><text x="28" y="659" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">В листе остаётся 4. Минимальная заполненность соблюдена.</text><path d="M450.0,735 L166.66666666666666,762" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M450.0,735 L450.0,762" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M450.0,735 L733.3333333333333,762" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="414.5" y="696" width="71" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="450.0" y="721" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">2 | 5</text><rect x="137.66666666666666" y="766" width="58" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="166.66666666666666" y="791" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">1</text><rect x="421.0" y="766" width="58" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="450.0" y="791" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">4</text><rect x="704.3333333333333" y="766" width="58" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="733.3333333333333" y="791" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">6</text><rect x="14" y="870" width="872" height="242" rx="10" fill="#f8fafc" stroke="#dbe2ec"/><text x="28" y="898" font-size="20" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Шаг 4. Перед удалением 1 приходится слить листья</text><text x="28" y="925" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">[1] и [4] не могут поделиться. Объединяем их с разделителем 2 из родителя.</text><path d="M450.0,1001 L237.5,1028" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M450.0,1001 L662.5,1028" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="421.0" y="962" width="58" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="450.0" y="987" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">5</text><rect x="180.0" y="1032" width="115" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="237.5" y="1057" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">1 | 2 | 4</text><rect x="633.5" y="1032" width="58" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="662.5" y="1057" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">6</text><rect x="14" y="1136" width="872" height="242" rx="10" fill="#f8fafc" stroke="#dbe2ec"/><text x="28" y="1164" font-size="20" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Шаг 5. Удаляем 1</text><text x="28" y="1191" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Слева остаются [2,4]; справа [6].</text><path d="M450.0,1267 L237.5,1294" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M450.0,1267 L662.5,1294" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="421.0" y="1228" width="58" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="450.0" y="1253" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">5</text><rect x="202.0" y="1298" width="71" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="237.5" y="1323" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">2 | 4</text><rect x="633.5" y="1298" width="58" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="662.5" y="1323" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">6</text><rect x="14" y="1402" width="872" height="242" rx="10" fill="#f8fafc" stroke="#dbe2ec"/><text x="28" y="1430" font-size="20" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Шаг 6. Перед удалением 6 заимствуем слева</text><text x="28" y="1457" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">5 опускается вправо, наибольший ключ левого брата 4 поднимается в корень.</text><path d="M450.0,1533 L237.5,1560" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M450.0,1533 L662.5,1560" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="421.0" y="1494" width="58" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="450.0" y="1519" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">4</text><rect x="208.5" y="1564" width="58" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="237.5" y="1589" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">2</text><rect x="627.0" y="1564" width="71" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="662.5" y="1589" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">5 | 6</text><rect x="14" y="1668" width="872" height="242" rx="10" fill="#f8fafc" stroke="#dbe2ec"/><text x="28" y="1696" font-size="20" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Шаг 7. Удаляем 6</text><text x="28" y="1723" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Оба листа минимально заполнены.</text><path d="M450.0,1799 L237.5,1826" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M450.0,1799 L662.5,1826" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="421.0" y="1760" width="58" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="450.0" y="1785" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">4</text><rect x="208.5" y="1830" width="58" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="237.5" y="1855" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">2</text><rect x="633.5" y="1830" width="58" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="662.5" y="1855" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">5</text><rect x="14" y="1934" width="872" height="172" rx="10" fill="#f8fafc" stroke="#dbe2ec"/><text x="28" y="1962" font-size="20" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Шаг 8. Перед удалением 2 объединяем всё в один узел</text><text x="28" y="1989" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">[2] + разделитель 4 + [5] дают новый корень-лист. Старый корень пуст и убирается.</text><rect x="392.5" y="2026" width="115" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="450.0" y="2051" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">2 | 4 | 5</text><rect x="14" y="2130" width="872" height="172" rx="10" fill="#f8fafc" stroke="#dbe2ec"/><text x="28" y="2158" font-size="20" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Шаг 9. Удаляем 2 из нового корня</text><text x="28" y="2185" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Ответ [4,5]. Высота уменьшилась: теперь это один лист.</text><rect x="414.5" y="2222" width="71" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="450.0" y="2247" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">4 | 5</text></svg>