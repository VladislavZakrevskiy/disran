<svg xmlns="http://www.w3.org/2000/svg" width="900" height="894" viewBox="0 0 900 894" role="img"><title>КЧ-удаление: дефицит чёрного поднимается к корню</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#64748b"/></marker></defs><rect width="900" height="894" fill="white"/><text x="28" y="37" font-size="23" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">КЧ-удаление: дефицит чёрного поднимается к корню</text><rect x="14" y="72" width="872" height="242" rx="10" fill="#f8fafc" stroke="#dbe2ec"/><text x="28" y="100" font-size="20" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Шаг 1. Исходное дерево</text><text x="28" y="127" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Удаляем чёрный лист 5.</text><path d="M450.0,203 L237.5,230" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M450.0,203 L662.5,230" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="421.0" y="164" width="58" height="38" rx="7" fill="#243247" stroke="#243247" stroke-width="2"/><text x="450.0" y="189" font-size="17" fill="white" text-anchor="middle" font-family="monospace">10Ч</text><rect x="208.5" y="234" width="58" height="38" rx="7" fill="#243247" stroke="#243247" stroke-width="2"/><text x="237.5" y="259" font-size="17" fill="white" text-anchor="middle" font-family="monospace">5Ч</text><rect x="633.5" y="234" width="58" height="38" rx="7" fill="#243247" stroke="#243247" stroke-width="2"/><text x="662.5" y="259" font-size="17" fill="white" text-anchor="middle" font-family="monospace">15Ч</text><rect x="14" y="338" width="872" height="242" rx="10" fill="#f8fafc" stroke="#dbe2ec"/><text x="28" y="366" font-size="20" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Шаг 2. Слева не хватает одного чёрного</text><text x="28" y="393" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">NIL* — тот же чёрный NIL, а звёздочка отмечает дефицит пути.</text><path d="M450.0,469 L237.5,496" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M450.0,469 L662.5,496" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="421.0" y="430" width="58" height="38" rx="7" fill="#243247" stroke="#243247" stroke-width="2"/><text x="450.0" y="455" font-size="17" fill="white" text-anchor="middle" font-family="monospace">10Ч</text><rect x="207.5" y="500" width="60" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="237.5" y="525" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">NIL*</text><rect x="633.5" y="500" width="58" height="38" rx="7" fill="#243247" stroke="#243247" stroke-width="2"/><text x="662.5" y="525" font-size="17" fill="white" text-anchor="middle" font-family="monospace">15Ч</text><rect x="14" y="604" width="872" height="266" rx="10" fill="#f8fafc" stroke="#dbe2ec"/><text x="28" y="632" font-size="20" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Шаг 3. Брат 15 чёрный, оба его ребёнка чёрные</text><text x="28" y="659" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Красим 15 в красный: обе ветви теперь потеряли по одному чёрному. Дефицит дошёл до</text><text x="28" y="683" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">корня и погашен.</text><path d="M450.0,759 L662.5,786" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="421.0" y="720" width="58" height="38" rx="7" fill="#243247" stroke="#243247" stroke-width="2"/><text x="450.0" y="745" font-size="17" fill="white" text-anchor="middle" font-family="monospace">10Ч</text><rect x="633.5" y="790" width="58" height="38" rx="7" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/><text x="662.5" y="815" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">15К</text></svg>