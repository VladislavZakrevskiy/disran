<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1163" viewBox="0 0 900 1163" role="img"><title>Treap: вставка ключа 3 с самым большим приоритетом</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#64748b"/></marker></defs><rect width="900" height="1163" fill="white"/><text x="28" y="37" font-size="23" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Treap: вставка ключа 3 с самым большим приоритетом</text><rect x="14" y="72" width="872" height="242" rx="10" fill="#f8fafc" stroke="#dbe2ec"/><text x="28" y="100" font-size="20" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Шаг 1. До вставки</text><text x="28" y="127" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Корень 2:30, справа 4:20. Новый узел — 3:50.</text><path d="M450.0,203 L662.5,230" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="420.0" y="164" width="60" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="450.0" y="189" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">2:30</text><rect x="632.5" y="234" width="60" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="662.5" y="259" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">4:20</text><rect x="14" y="338" width="872" height="269" rx="10" fill="#f8fafc" stroke="#dbe2ec"/><text x="28" y="366" font-size="20" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Шаг 2. Split по 3</text><text x="28" y="393" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Левый результат — 2:30, правый — 4:20. Приоритет 50 больше обоих.</text><text x="32" y="446" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Слева</text><rect x="161.0" y="421" width="58" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="190" y="446" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">2:30</text><text x="32" y="501" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Новый</text><rect x="161.0" y="476" width="58" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="190" y="501" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">3:50</text><text x="32" y="556" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Справа</text><rect x="161.0" y="531" width="58" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="190" y="556" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">4:20</text><rect x="14" y="631" width="872" height="242" rx="10" fill="#f8fafc" stroke="#dbe2ec"/><text x="28" y="659" font-size="20" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Шаг 3. Два merge поднимают новый узел</text><text x="28" y="686" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">2 становится левым ребёнком 3, а 4 — правым.</text><path d="M450.0,762 L237.5,789" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M450.0,762 L662.5,789" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="420.0" y="723" width="60" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="450.0" y="748" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">3:50</text><rect x="207.5" y="793" width="60" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="237.5" y="818" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">2:30</text><rect x="632.5" y="793" width="60" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="662.5" y="818" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">4:20</text><rect x="14" y="897" width="872" height="242" rx="10" fill="#f8fafc" stroke="#dbe2ec"/><text x="28" y="925" font-size="20" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Шаг 4. Если теперь удалить 3</text><text x="28" y="952" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Соединяем его детей. 30 &gt; 20, поэтому 2 становится корнем, а 4 — правым ребёнком.</text><path d="M450.0,1028 L662.5,1055" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="420.0" y="989" width="60" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="450.0" y="1014" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">2:30</text><rect x="632.5" y="1059" width="60" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="662.5" y="1084" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">4:20</text></svg>