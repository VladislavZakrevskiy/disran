<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1626" viewBox="0 0 900 1626" role="img"><title>BST: удаляем узел 8 с двумя детьми</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#64748b"/></marker></defs><rect width="900" height="1626" fill="white"/><text x="28" y="37" font-size="23" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">BST: удаляем узел 8 с двумя детьми</text><rect x="14" y="72" width="872" height="382" rx="10" fill="#f8fafc" stroke="#dbe2ec"/><text x="28" y="100" font-size="20" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Шаг 1. Исходное дерево</text><text x="28" y="127" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Нельзя выбросить 8 вместе с одним из поддеревьев.</text><path d="M450.0,203 L237.5,230" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M556.25,343 L609.375,370" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M662.5,273 L556.25,300" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M662.5,273 L768.75,300" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M450.0,203 L662.5,230" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="421.0" y="164" width="58" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="450.0" y="189" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">8</text><rect x="208.5" y="234" width="58" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="237.5" y="259" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">3</text><rect x="633.5" y="234" width="58" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="662.5" y="259" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">12</text><rect x="527.25" y="304" width="58" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="556.25" y="329" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">10</text><rect x="580.375" y="374" width="58" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="609.375" y="399" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">11</text><rect x="739.75" y="304" width="58" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="768.75" y="329" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">14</text><rect x="14" y="478" width="872" height="382" rx="10" fill="#f8fafc" stroke="#dbe2ec"/><text x="28" y="506" font-size="20" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Шаг 2. Находим следующий ключ</text><text x="28" y="533" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Один раз вправо к 12, затем влево к 10. У 10 нет левого ребёнка.</text><path d="M450.0,609 L237.5,636" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M556.25,749 L609.375,776" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M662.5,679 L556.25,706" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M662.5,679 L768.75,706" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M450.0,609 L662.5,636" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="421.0" y="570" width="58" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="450.0" y="595" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">8</text><rect x="208.5" y="640" width="58" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="237.5" y="665" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">3</text><rect x="633.5" y="640" width="58" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="662.5" y="665" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">12</text><rect x="526.25" y="710" width="60" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="556.25" y="735" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">10 ←</text><rect x="580.375" y="780" width="58" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="609.375" y="805" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">11</text><rect x="739.75" y="710" width="58" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="768.75" y="735" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">14</text><rect x="14" y="884" width="872" height="382" rx="10" fill="#f8fafc" stroke="#dbe2ec"/><text x="28" y="912" font-size="20" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Шаг 3. Переносим значение 10 в корень</text><text x="28" y="939" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Временно две вершины содержат 10. Нижнюю сейчас физически удалим.</text><path d="M450.0,1015 L237.5,1042" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M556.25,1155 L609.375,1182" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M662.5,1085 L556.25,1112" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M662.5,1085 L768.75,1112" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M450.0,1015 L662.5,1042" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="421.0" y="976" width="58" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="450.0" y="1001" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">10</text><rect x="208.5" y="1046" width="58" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="237.5" y="1071" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">3</text><rect x="633.5" y="1046" width="58" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="662.5" y="1071" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">12</text><rect x="527.25" y="1116" width="58" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="556.25" y="1141" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">10</text><rect x="580.375" y="1186" width="58" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="609.375" y="1211" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">11</text><rect x="739.75" y="1116" width="58" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="768.75" y="1141" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">14</text><rect x="14" y="1290" width="872" height="312" rx="10" fill="#f8fafc" stroke="#dbe2ec"/><text x="28" y="1318" font-size="20" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Шаг 4. Исключаем прежний узел 10</text><text x="28" y="1345" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Его единственный ребёнок 11 занимает его место слева от 12.</text><path d="M450.0,1421 L237.5,1448" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M662.5,1491 L556.25,1518" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M662.5,1491 L768.75,1518" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M450.0,1421 L662.5,1448" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="421.0" y="1382" width="58" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="450.0" y="1407" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">10</text><rect x="208.5" y="1452" width="58" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="237.5" y="1477" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">3</text><rect x="633.5" y="1452" width="58" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="662.5" y="1477" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">12</text><rect x="527.25" y="1522" width="58" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="556.25" y="1547" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">11</text><rect x="739.75" y="1522" width="58" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="768.75" y="1547" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">14</text></svg>