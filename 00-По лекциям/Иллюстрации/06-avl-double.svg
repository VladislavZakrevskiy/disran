<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1010" viewBox="0 0 900 1010" role="img"><title>AVL: двойной поворот распрямляет внутренний изгиб</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#64748b"/></marker></defs><rect width="900" height="1010" fill="white"/><text x="28" y="37" font-size="23" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">AVL: двойной поворот распрямляет внутренний изгиб</text><rect x="14" y="72" width="872" height="312" rx="10" fill="#f8fafc" stroke="#dbe2ec"/><text x="28" y="100" font-size="20" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Шаг 1. Вставляем 30, затем 10, затем 20</text><text x="28" y="127" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">У 30 баланс +2, у 10 баланс −1. Знаки различны: одного правого поворота мало.</text><path d="M237.5,273 L343.75,300" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M450.0,203 L237.5,230" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="421.0" y="164" width="58" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="450.0" y="189" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">30</text><rect x="208.5" y="234" width="58" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="237.5" y="259" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">10</text><rect x="314.75" y="304" width="58" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="343.75" y="329" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">20</text><rect x="14" y="408" width="872" height="312" rx="10" fill="#f8fafc" stroke="#dbe2ec"/><text x="28" y="436" font-size="20" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Шаг 2. Левый поворот вокруг 10</text><text x="28" y="463" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">20 поднимается над 10; получилась обычная левая цепочка.</text><path d="M237.5,609 L131.25,636" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M450.0,539 L237.5,566" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="421.0" y="500" width="58" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="450.0" y="525" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">30</text><rect x="208.5" y="570" width="58" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="237.5" y="595" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">20</text><rect x="102.25" y="640" width="58" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="131.25" y="665" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">10</text><rect x="14" y="744" width="872" height="242" rx="10" fill="#f8fafc" stroke="#dbe2ec"/><text x="28" y="772" font-size="20" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Шаг 3. Правый поворот вокруг 30</text><text x="28" y="799" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Средний по значению ключ 20 становится корнем.</text><path d="M450.0,875 L237.5,902" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M450.0,875 L662.5,902" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="421.0" y="836" width="58" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="450.0" y="861" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">20</text><rect x="208.5" y="906" width="58" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="237.5" y="931" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">10</text><rect x="633.5" y="906" width="58" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="662.5" y="931" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">30</text></svg>