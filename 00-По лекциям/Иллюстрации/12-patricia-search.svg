<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1024" viewBox="0 0 900 1024" role="img"><title>PATRICIA: сначала кандидат, потом полное сравнение</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#64748b"/></marker></defs><rect width="900" height="1024" fill="white"/><text x="28" y="37" font-size="23" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">PATRICIA: сначала кандидат, потом полное сравнение</text><rect x="14" y="72" width="872" height="214" rx="10" fill="#f8fafc" stroke="#dbe2ec"/><text x="28" y="100" font-size="20" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Шаг 1. Ищем 10: проверяем первый бит</text><text x="28" y="127" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">В узле 10 проверяется бит 1 запроса. Он равен 1 — идём к узлу 11.</text><text x="32" y="180" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Запрос</text><rect x="168.0" y="155" width="44" height="38" rx="7" fill="#fef3c7" stroke="#a16207" stroke-width="2"/><text x="190" y="180" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">1</text><rect x="217.0" y="155" width="44" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="239" y="180" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">0</text><text x="32" y="235" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Номера b</text><rect x="168.0" y="210" width="44" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="190" y="235" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">0</text><rect x="217.0" y="210" width="44" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="239" y="235" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">1</text><rect x="266.0" y="210" width="44" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="288" y="235" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">2</text><rect x="14" y="310" width="872" height="214" rx="10" fill="#f8fafc" stroke="#dbe2ec"/><text x="28" y="338" font-size="20" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Шаг 2. В узле 11 проверяем второй бит запроса</text><text x="28" y="365" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">У запроса 10 второй бит равен 0. Обратная ссылка приводит к ключу 10.</text><text x="32" y="418" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Запрос</text><rect x="168.0" y="393" width="44" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="190" y="418" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">1</text><rect x="217.0" y="393" width="44" height="38" rx="7" fill="#fef3c7" stroke="#a16207" stroke-width="2"/><text x="239" y="418" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">0</text><text x="32" y="473" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Кандидат</text><rect x="168.0" y="448" width="44" height="38" rx="7" fill="#dcfce7" stroke="#16803c" stroke-width="2"/><text x="190" y="473" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">1</text><rect x="217.0" y="448" width="44" height="38" rx="7" fill="#dcfce7" stroke="#16803c" stroke-width="2"/><text x="239" y="473" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">0</text><rect x="14" y="548" width="872" height="159" rx="10" fill="#f8fafc" stroke="#dbe2ec"/><text x="28" y="576" font-size="20" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Шаг 3. Номера пошли назад: 2 → 1</text><text x="28" y="603" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Останавливаем переходы и сравниваем ключ целиком. 10 = 10: найдено.</text><text x="32" y="656" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Маршрут b</text><rect x="168.0" y="631" width="44" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="190" y="656" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">0</text><rect x="217.0" y="631" width="44" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="239" y="656" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">1</text><rect x="266.0" y="631" width="44" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="288" y="656" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">2</text><rect x="315.0" y="631" width="44" height="38" rx="7" fill="#dcfce7" stroke="#16803c" stroke-width="2"/><text x="337" y="656" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">1</text><rect x="14" y="731" width="872" height="269" rx="10" fill="#f8fafc" stroke="#dbe2ec"/><text x="28" y="759" font-size="20" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Шаг 4. Теперь независимо ищем 01</text><text x="28" y="786" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Первый бит 0 сразу возвращает из узла 10 в header. Но кандидат 00 не равен 01.</text><text x="32" y="839" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Запрос</text><rect x="168.0" y="814" width="44" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="190" y="839" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">0</text><rect x="217.0" y="814" width="44" height="38" rx="7" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/><text x="239" y="839" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">1</text><text x="32" y="894" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Кандидат</text><rect x="168.0" y="869" width="44" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="190" y="894" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">0</text><rect x="217.0" y="869" width="44" height="38" rx="7" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/><text x="239" y="894" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">0</text><text x="32" y="949" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Маршрут b</text><rect x="168.0" y="924" width="44" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="190" y="949" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">0</text><rect x="217.0" y="924" width="44" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="239" y="949" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">1</text><rect x="266.0" y="924" width="44" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="288" y="949" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">0</text></svg>