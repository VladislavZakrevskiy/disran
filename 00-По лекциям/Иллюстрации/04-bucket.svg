<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1024" viewBox="0 0 900 1024" role="img"><title>Карманная сортировка: распределить → упорядочить → склеить</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#64748b"/></marker></defs><rect width="900" height="1024" fill="white"/><text x="28" y="37" font-size="23" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Карманная сортировка: распределить → упорядочить → склеить</text><rect x="14" y="72" width="872" height="214" rx="10" fill="#f8fafc" stroke="#dbe2ec"/><text x="28" y="100" font-size="20" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Шаг 1. Выбираем четыре кармана</text><text x="28" y="127" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Вход [0.7,0.1,0.6,0.3], n=4. Индекс кармана — целая часть 4x.</text><text x="32" y="180" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">x</text><rect x="168.0" y="155" width="44" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="190" y="180" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">0.7</text><rect x="217.0" y="155" width="44" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="239" y="180" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">0.1</text><rect x="266.0" y="155" width="44" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="288" y="180" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">0.6</text><rect x="315.0" y="155" width="44" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="337" y="180" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">0.3</text><text x="32" y="235" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">⌊4x⌋</text><rect x="168.0" y="210" width="44" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="190" y="235" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">2</text><rect x="217.0" y="210" width="44" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="239" y="235" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">0</text><rect x="266.0" y="210" width="44" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="288" y="235" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">2</text><rect x="315.0" y="210" width="44" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="337" y="235" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">1</text><rect x="14" y="310" width="872" height="324" rx="10" fill="#f8fafc" stroke="#dbe2ec"/><text x="28" y="338" font-size="20" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Шаг 2. Раскладываем числа</text><text x="28" y="365" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Карман 2 получает 0.7 и 0.6 именно в исходном порядке.</text><text x="32" y="418" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">[0,.25)</text><rect x="168.0" y="393" width="44" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="190" y="418" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">0.1</text><text x="32" y="473" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">[.25,.5)</text><rect x="168.0" y="448" width="44" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="190" y="473" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">0.3</text><text x="32" y="528" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">[.5,.75)</text><rect x="168.0" y="503" width="44" height="38" rx="7" fill="#fef3c7" stroke="#a16207" stroke-width="2"/><text x="190" y="528" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">0.7</text><rect x="217.0" y="503" width="44" height="38" rx="7" fill="#fef3c7" stroke="#a16207" stroke-width="2"/><text x="239" y="528" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">0.6</text><text x="32" y="583" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">[.75,1)</text><rect x="168.0" y="558" width="44" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="190" y="583" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">∅</text><rect x="14" y="658" width="872" height="159" rx="10" fill="#f8fafc" stroke="#dbe2ec"/><text x="28" y="686" font-size="20" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Шаг 3. Сортируем внутри карманов</text><text x="28" y="713" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Во втором по индексу кармане меняем 0.7 и 0.6. Остальным делать нечего.</text><text x="32" y="766" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Карман 2</text><rect x="168.0" y="741" width="44" height="38" rx="7" fill="#dcfce7" stroke="#16803c" stroke-width="2"/><text x="190" y="766" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">0.6</text><rect x="217.0" y="741" width="44" height="38" rx="7" fill="#dcfce7" stroke="#16803c" stroke-width="2"/><text x="239" y="766" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">0.7</text><rect x="14" y="841" width="872" height="159" rx="10" fill="#f8fafc" stroke="#dbe2ec"/><text x="28" y="869" font-size="20" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Шаг 4. Читаем карманы от 0 до 3</text><text x="28" y="896" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Пустой карман ничего не добавляет.</text><text x="32" y="949" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Ответ</text><rect x="168.0" y="924" width="44" height="38" rx="7" fill="#dcfce7" stroke="#16803c" stroke-width="2"/><text x="190" y="949" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">0.1</text><rect x="217.0" y="924" width="44" height="38" rx="7" fill="#dcfce7" stroke="#16803c" stroke-width="2"/><text x="239" y="949" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">0.3</text><rect x="266.0" y="924" width="44" height="38" rx="7" fill="#dcfce7" stroke="#16803c" stroke-width="2"/><text x="288" y="949" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">0.6</text><rect x="315.0" y="924" width="44" height="38" rx="7" fill="#dcfce7" stroke="#16803c" stroke-width="2"/><text x="337" y="949" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">0.7</text></svg>