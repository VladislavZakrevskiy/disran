<svg xmlns="http://www.w3.org/2000/svg" width="900" height="841" viewBox="0 0 900 841" role="img"><title>Длина 1: p хранит порядок, c — классы по исходным позициям</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#64748b"/></marker></defs><rect width="900" height="841" fill="white"/><text x="28" y="37" font-size="23" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Длина 1: p хранит порядок, c — классы по исходным позициям</text><rect x="14" y="72" width="872" height="214" rx="10" fill="#f8fafc" stroke="#dbe2ec"/><text x="28" y="100" font-size="20" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Шаг 1. Добавили $ к aba</text><text x="28" y="127" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Порядок символов: $ &lt; a &lt; b.</text><text x="32" y="180" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Позиция</text><rect x="168.0" y="155" width="44" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="190" y="180" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">1</text><rect x="217.0" y="155" width="44" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="239" y="180" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">2</text><rect x="266.0" y="155" width="44" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="288" y="180" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">3</text><rect x="315.0" y="155" width="44" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="337" y="180" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">4</text><text x="32" y="235" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Строка</text><rect x="168.0" y="210" width="44" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="190" y="235" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">a</text><rect x="217.0" y="210" width="44" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="239" y="235" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">b</text><rect x="266.0" y="210" width="44" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="288" y="235" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">a</text><rect x="315.0" y="210" width="44" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="337" y="235" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">$</text><rect x="14" y="310" width="872" height="214" rx="10" fill="#f8fafc" stroke="#dbe2ec"/><text x="28" y="338" font-size="20" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Шаг 2. Стабильно отсортировали символы</text><text x="28" y="365" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Сначала позиция 4 ($), затем 1 и 3 (a), затем 2 (b).</text><text x="32" y="418" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">p</text><rect x="168.0" y="393" width="44" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="190" y="418" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">4</text><rect x="217.0" y="393" width="44" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="239" y="418" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">1</text><rect x="266.0" y="393" width="44" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="288" y="418" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">3</text><rect x="315.0" y="393" width="44" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="337" y="418" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">2</text><text x="32" y="473" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Символы</text><rect x="168.0" y="448" width="44" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="190" y="473" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">$</text><rect x="217.0" y="448" width="44" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="239" y="473" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">a</text><rect x="266.0" y="448" width="44" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="288" y="473" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">a</text><rect x="315.0" y="448" width="44" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="337" y="473" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">b</text><rect x="14" y="548" width="872" height="269" rx="10" fill="#f8fafc" stroke="#dbe2ec"/><text x="28" y="576" font-size="20" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Шаг 3. Назначили классы: $ → 1, a → 2, b → 3</text><text x="28" y="603" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">c записываем в исходном порядке позиций 1,2,3,4; это не порядок p.</text><text x="32" y="656" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Позиция</text><rect x="168.0" y="631" width="44" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="190" y="656" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">1</text><rect x="217.0" y="631" width="44" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="239" y="656" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">2</text><rect x="266.0" y="631" width="44" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="288" y="656" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">3</text><rect x="315.0" y="631" width="44" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="337" y="656" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">4</text><text x="32" y="711" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Строка</text><rect x="168.0" y="686" width="44" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="190" y="711" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">a</text><rect x="217.0" y="686" width="44" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="239" y="711" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">b</text><rect x="266.0" y="686" width="44" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="288" y="711" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">a</text><rect x="315.0" y="686" width="44" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="337" y="711" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">$</text><text x="32" y="766" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">c</text><rect x="168.0" y="741" width="44" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="190" y="766" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">2</text><rect x="217.0" y="741" width="44" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="239" y="766" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">3</text><rect x="266.0" y="741" width="44" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="288" y="766" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">2</text><rect x="315.0" y="741" width="44" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="337" y="766" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">1</text></svg>