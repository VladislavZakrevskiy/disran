<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1024" viewBox="0 0 900 1024" role="img"><title>Вычисление sp: откат на короткой строке ababaa</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#64748b"/></marker></defs><rect width="900" height="1024" fill="white"/><text x="28" y="37" font-size="23" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Вычисление sp: откат на короткой строке ababaa</text><rect x="14" y="72" width="872" height="214" rx="10" fill="#f8fafc" stroke="#dbe2ec"/><text x="28" y="100" font-size="20" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Шаг 1. До последней буквы граница aba</text><text x="28" y="127" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">У ababa значение sp₅ = 3. Новая буква — a.</text><text x="32" y="180" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">P</text><rect x="168.0" y="155" width="44" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="190" y="180" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">a</text><rect x="217.0" y="155" width="44" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="239" y="180" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">b</text><rect x="266.0" y="155" width="44" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="288" y="180" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">a</text><rect x="315.0" y="155" width="44" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="337" y="180" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">b</text><rect x="364.0" y="155" width="44" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="386" y="180" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">a</text><rect x="413.0" y="155" width="44" height="38" rx="7" fill="#fef3c7" stroke="#a16207" stroke-width="2"/><text x="435" y="180" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">a</text><text x="32" y="235" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">sp</text><rect x="168.0" y="210" width="44" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="190" y="235" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">0</text><rect x="217.0" y="210" width="44" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="239" y="235" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">0</text><rect x="266.0" y="210" width="44" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="288" y="235" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">1</text><rect x="315.0" y="210" width="44" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="337" y="235" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">2</text><rect x="364.0" y="210" width="44" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="386" y="235" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">3</text><rect x="413.0" y="210" width="44" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="435" y="235" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">?</text><rect x="14" y="310" width="872" height="214" rx="10" fill="#f8fafc" stroke="#dbe2ec"/><text x="28" y="338" font-size="20" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Шаг 2. Длина 3 не продолжается</text><text x="28" y="365" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">После префикса aba стоит b; новая a не подходит. q = sp₃ = 1.</text><text x="32" y="418" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Ожидаем</text><rect x="168.0" y="393" width="44" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="190" y="418" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">a</text><rect x="217.0" y="393" width="44" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="239" y="418" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">b</text><rect x="266.0" y="393" width="44" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="288" y="418" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">a</text><rect x="315.0" y="393" width="44" height="38" rx="7" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/><text x="337" y="418" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">b</text><text x="32" y="473" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">В конце</text><rect x="168.0" y="448" width="44" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="190" y="473" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">a</text><rect x="217.0" y="448" width="44" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="239" y="473" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">b</text><rect x="266.0" y="448" width="44" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="288" y="473" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">a</text><rect x="315.0" y="448" width="44" height="38" rx="7" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/><text x="337" y="473" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">a</text><rect x="14" y="548" width="872" height="214" rx="10" fill="#f8fafc" stroke="#dbe2ec"/><text x="28" y="576" font-size="20" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Шаг 3. Длина 1 тоже не продолжается</text><text x="28" y="603" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">После префикса a снова b. q = sp₁ = 0. Теперь первая a подходит.</text><text x="32" y="656" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Ожидаем</text><rect x="168.0" y="631" width="44" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="190" y="656" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">a</text><rect x="217.0" y="631" width="44" height="38" rx="7" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/><text x="239" y="656" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">b</text><text x="32" y="711" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">В конце</text><rect x="168.0" y="686" width="44" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="190" y="711" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">a</text><rect x="217.0" y="686" width="44" height="38" rx="7" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/><text x="239" y="711" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">a</text><rect x="14" y="786" width="872" height="214" rx="10" fill="#f8fafc" stroke="#dbe2ec"/><text x="28" y="814" font-size="20" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Шаг 4. Новая граница — одна a</text><text x="28" y="841" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Записываем sp₆ = 1. Проверили длины 3 → 1 → 0; затем прибавили 1.</text><text x="32" y="894" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">P</text><rect x="168.0" y="869" width="44" height="38"