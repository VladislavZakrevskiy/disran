oke-width="2"/><text x="190" y="345" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">a</text><rect x="217.0" y="320" width="44" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="239" y="345" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">b</text><rect x="266.0" y="320" width="44" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="288" y="345" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">a</text><rect x="315.0" y="320" width="44" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="337" y="345" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">c</text><rect x="14" y="420" width="872" height="214" rx="10" fill="#f8fafc" stroke="#dbe2ec"/><text x="28" y="448" font-size="20" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Шаг 2. Сравниваем два варианта на a</text><text x="28" y="475" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">acab и abac: первая буква равна, на второй b &lt; c. Побеждает abac.</text><text x="32" y="528" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Начало 2</text><rect x="168.0" y="503" width="44" height="38" rx="7" fill="#dcfce7" stroke="#16803c" stroke-width="2"/><text x="190" y="528" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">a</text><rect x="217.0" y="503" width="44" height="38" rx="7" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/><text x="239" y="528" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">c</text><rect x="266.0" y="503" width="44" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="288" y="528" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">a</text><rect x="315.0" y="503" width="44" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width