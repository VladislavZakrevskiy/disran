<svg xmlns="http://www.w3.org/2000/svg" width="900" height="2619" viewBox="0 0 900 2619" role="img"><title>Укконен: abab$ по фазам и отдельным изменениям</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#64748b"/></marker></defs><rect width="900" height="2619" fill="white"/><text x="28" y="37" font-size="23" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Укконен: abab$ по фазам и отдельным изменениям</text><rect x="14" y="72" width="872" height="297" rx="10" fill="#f8fafc" stroke="#dbe2ec"/><text x="28" y="100" font-size="20" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Шаг 1. Фаза 1: a, end = 1</text><text x="28" y="127" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Из корня добавляем первый лист. Правило 2.</text><path d="M450,203 L240,280" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="350.0" y="236.5" font-size="14" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">a</text><rect x="411.0" y="164" width="78" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="450" y="189" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">корень</text><rect x="201.0" y="284" width="78" height="38" rx="7" fill="#dcfce7" stroke="#16803c" stroke-width="2"/><text x="240" y="309" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">лист 1</text><rect x="14" y="393" width="872" height="297" rx="10" fill="#f8fafc" stroke="#dbe2ec"/><text x="28" y="421" font-size="20" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Шаг 2. Фаза 2: ab, end = 2</text><text x="28" y="448" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Старое ребро удлинилось через end; для b добавляем лист 2.</text><path d="M450,524 L240,601" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="350.0" y="557.5" font-size="14" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">ab</text><path d="M450,524 L670,601" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="565.0" y="557.5" font-size="14" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">b</text><rect x="411.0" y="485" width="78" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="450" y="510" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">корень</text><rect x="201.0" y="605" width="78" height="38" rx="7" fill="#dcfce7" stroke="#16803c" stroke-width="2"/><text x="240" y="630" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">лист 1</text><rect x="631.0" y="605" width="78" height="38" rx="7" fill="#dcfce7" stroke="#16803c" stroke-width="2"/><text x="670" y="630" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">лист 2</text><rect x="14" y="714" width="872" height="297" rx="10" fill="#f8fafc" stroke="#dbe2ec"/><text x="28" y="742" font-size="20" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Шаг 3. Фаза 3: aba, end = 3</text><text x="28" y="769" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Два старых листа удлинились. Суффикс a уже есть внутри ребра: правило 3, стоп.</text><path d="M450,845 L240,922" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="350.0" y="878.5" font-size="14" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">aba</text><path d="M450,845 L670,922" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="565.0" y="878.5" font-size="14" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">ba</text><rect x="411.0" y="806" width="78" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="450" y="831" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">корень</text><rect x="201.0" y="926" width="78" height="38" rx="7" fill="#dcfce7" stroke="#16803c" stroke-width="2"/><text x="240" y="951" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">лист 1</text><rect x="631.0" y="926" width="78" height="38" rx="7" fill="#dcfce7" stroke="#16803c" stroke-width="2"/><text x="670" y="951" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">лист 2</text><rect x="14" y="1035" width="872" height="297" rx="10" fill="#f8fafc" stroke="#dbe2ec"/><text x="28" y="1063" font-size="20" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Шаг 4. Фаза 4: abab, end = 4</text><text x="28" y="1090" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Сохранённый путь a продолжается буквой b. ab уже есть: правило 3, стоп.</text><path d="M450,1166 L240,1243" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="350.0" y="1199.5" font-size="14" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">abab</text><path d="M450,1166 L670,1243" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="565.0" y="1199.5" font-size="14" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">bab</text><rect x="411.0" y="1127" width="78" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="450" y="1152" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">корень</text><rect x="201.0" y="1247" width="78" height="38" rx="7" fill="#dcfce7" stroke="#16803c" stroke-width="2"/><text x="240" y="1272" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">лист 1</text><rect x="631.0" y="1247" width="78" height="38" rx="7" fill="#dcfce7" stroke="#16803c" stroke-width="2"/><text x="670" y="1272" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">лист 2</text><rect x="14" y="1356" width="872" height="397" rx="10" fill="#f8fafc" stroke="#dbe2ec"/><text x="28" y="1384" font-size="20" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Шаг 5. Фаза 5: $, end = 5; продолжаем ab</text><text x="28" y="1411" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">В старом ребре после ab идёт a, а нужна $. Разбиваем ребро; добавляем лист 3.</text><path d="M450,1487 L210,1544" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="335.0" y="1510.5" font-size="14" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">ab [1,2]</text><path d="M210,1587 L110,1664" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="165.0" y="1620.5" font-size="14" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">ab$ [3,end]</text><path d="M210,1587 L300,1664" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="260.0" y="1620.5" font-size="14" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">$ [5,end]</text><path d="M450,1487 L650,1544" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="555.0" y="1510.5" font-size="14" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">bab$ [2,end]</text><rect x="411.0" y="1448" width="78" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="450" y="1473" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">корень</text><rect x="181.0" y="1548" width="58" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="210" y="1573" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">ab</text><rect x="71.0" y="1668" width="78" height="38" rx="7" fill="#dcfce7" stroke="#16803c" stroke-width="2"/><text x="110" y="1693" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">лист 1</text><rect x="261.0" y="1668" width="78" height="38" rx="7" fill="#dcfce7" stroke="#16803c" stroke-width="2"/><text x="300" y="1693" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">лист 3</text><rect x="611.0" y="1548" width="78" height="38" rx="7" fill="#dcfce7" stroke="#16803c" stroke-width="2"/><text x="650" y="1573" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">лист 2</text><rect x="14" y="1777" width="872" height="397" rx="10" fill="#f8fafc" stroke="#dbe2ec"/><text x="28" y="1805" font-size="20" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Шаг 6. Та же фаза: продолжаем b</text><text x="28" y="1832" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Из корня находим известный путь b и разбиваем второе ребро. Добавляем лист 4.</text><path d="M450,1908 L210,1965" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="335.0" y="1931.5" font-size="14" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">ab [1,2]</text><path d="M210,2008 L110,2085" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="165.0" y="2041.5" font-size="14" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">ab$ [3,end]</text><path d="M210,2008 L300,2085" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="260.0" y="2041.5" font-size="14" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">$ [5,end]</text><path d="M450,1908 L570,1965" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="515.0" y="1931.5" font-size="14" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">b [2,2]</text><path d="M570,2008 L470,2085" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="525.0" y="2041.5" font-size="14" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">ab$ [3,end]</text><path d="M570,2008 L650,2085" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="615.0" y="2041.5" font-size="14" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">$ [5,end]</text><rect x="411.0" y="1869" width="78" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="450" y="1894" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">корень</text><rect x="181.0" y="1969" width="58" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="210" y="1994" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">ab</text><rect x="71.0" y="2089" width="78" height="38" rx="7" fill="#dcfce7" stroke="#16803c" stroke-width="2"/><text x="110" y="2114" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">лист 1</text><rect x="261.0" y="2089" width="78" height="38" rx="7" fill="#dcfce7" stroke="#16803c" stroke-width="2"/><text x="300" y="2114" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">лист 3</text><rect x="541.0" y="1969" width="58" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="570" y="1994" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">b</text><rect x="431.0" y="2089" width="78" height="38" rx="7" fill="#dcfce7" stroke="#16803c" stroke-width="2"/><text x="470" y="2114" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">лист 2</text><rect x="611.0" y="2089" width="78" height="38" rx="7" fill="#dcfce7" stroke="#16803c" stroke-width="2"/><text x="650" y="2114" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">лист 4</text><rect x="14" y="2198" width="872" height="397" rx="10" fill="#f8fafc" stroke="#dbe2ec"/><text x="28" y="2226" font-size="20" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Шаг 7. Та же фаза: добавляем отдельный $</text><text x="28" y="2253" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Создаём лист 5 из корня. Суффиксные ссылки новых вершин: ab → b → корень.</text><path d="M450,2329 L210,2386" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="335.0" y="2352.5" font-size="14" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">ab [1,2]</text><path d="M210,2429 L110,2506" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="165.0" y="2462.5" font-size="14" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">ab$ [3,end]</text><path d="M210,2429 L300,2506" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="260.0" y="2462.5" font-size="14" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">$ [5,end]</text><path d="M450,2329 L570,2386" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="515.0" y="2352.5" font-size="14" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">b [2,2]</text><path d="M570,2429 L470,2506" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="525.0" y="2462.5" font-size="14" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">ab$ [3,end]</text><path d="M570,2429 L650,2506" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="615.0" y="2462.5" font-size="14" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">$ [5,end]</text><path d="M450,2329 L790,2386" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="625.0" y="2352.5" font-size="14" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">$ [5,end]</text><rect x="411.0" y="2290" width="78" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="450" y="2315" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">корень</text><rect x="181.0" y="2390" width="58" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="210" y="2415" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">ab</text><rect x="71.0" y="2510" width="78" height="38" rx="7" fill="#dcfce7" stroke="#16803c" stroke-width="2"/><text x="110" y="2535" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">лист 1</text><rect x="261.0" y="2510" width="78" height="38" rx="7" fill="#dcfce7" stroke="#16803c" stroke-width="2"/><text x="300" y="2535" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">лист 3</text><rect x="541.0" y="2390" width="58" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="570" y="2415" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">b</text><rect x="431.0" y="2510" width="78" height="38" rx="7" fill="#dcfce7" stroke="#16803c" stroke-width="2"/><text x="470" y="2535" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">лист 2</text><rect x="611.0" y="2510" width="78" height="38" rx="7" fill="#dcfce7" stroke="#16803c" stroke-width="2"/><text x="650" y="2535" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">лист 4</text><rect x="751.0" y="2390" width="78" height="38" rx="7" fill="#dcfce7" stroke="#16803c" stroke-width="2"/><text x="790" y="2415" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">лист 5</text></svg>