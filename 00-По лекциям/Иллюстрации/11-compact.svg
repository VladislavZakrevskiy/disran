<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1802" viewBox="0 0 900 1802" role="img"><title>Compact trie: разделение ребра и обратная склейка</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#64748b"/></marker></defs><rect width="900" height="1802" fill="white"/><text x="28" y="37" font-size="23" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Compact trie: разделение ребра и обратная склейка</text><rect x="14" y="72" width="872" height="277" rx="10" fill="#f8fafc" stroke="#dbe2ec"/><text x="28" y="100" font-size="20" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Шаг 1. Первое слово кот$</text><text x="28" y="127" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Всё слово хранится одной меткой ребра. Промежуточные вершины не нужны.</text><path d="M450,203 L450,260" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="455.0" y="226.5" font-size="14" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">кот$</text><rect x="411.0" y="164" width="78" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="450" y="189" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">корень</text><rect x="421.0" y="264" width="58" height="38" rx="7" fill="#dcfce7" stroke="#16803c" stroke-width="2"/><text x="450" y="289" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">кот$</text><rect x="14" y="373" width="872" height="352" rx="10" fill="#f8fafc" stroke="#dbe2ec"/><text x="28" y="401" font-size="20" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Шаг 2. Вставляем ком$</text><text x="28" y="428" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Совпадает ко; затем т и м различаются. Создаём точку ветвления после ко.</text><path d="M450,504 L450,541" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="455.0" y="517.5" font-size="14" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">ко</text><path d="M450,584 L260,636" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="360.0" y="605.0" font-size="14" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">т$</text><path d="M450,584 L640,636" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="550.0" y="605.0" font-size="14" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">м$</text><rect x="411.0" y="465" width="78" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="450" y="490" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">корень</text><rect x="421.0" y="545" width="58" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="450" y="570" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">•</text><rect x="231.0" y="640" width="58" height="38" rx="7" fill="#dcfce7" stroke="#16803c" stroke-width="2"/><text x="260" y="665" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">кот$</text><rect x="611.0" y="640" width="58" height="38" rx="7" fill="#dcfce7" stroke="#16803c" stroke-width="2"/><text x="640" y="665" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">ком$</text><rect x="14" y="749" width="872" height="352" rx="10" fill="#f8fafc" stroke="#dbe2ec"/><text x="28" y="777" font-size="20" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Шаг 3. Дополнительно вставляем ко$</text><text x="28" y="804" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">После ко новый ключ заканчивается. Создаём отдельную ветвь с меткой $.</text><path d="M450,880 L450,917" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="455.0" y="893.5" font-size="14" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">ко</text><path d="M450,960 L260,1012" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="360.0" y="981.0" font-size="14" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">т$</text><path d="M450,960 L640,1012" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="550.0" y="981.0" font-size="14" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">м$</text><path d="M450,960 L450,1012" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="455.0" y="981.0" font-size="14" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">$</text><rect x="411.0" y="841" width="78" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="450" y="866" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">корень</text><rect x="421.0" y="921" width="58" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="450" y="946" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">•</text><rect x="231.0" y="1016" width="58" height="38" rx="7" fill="#dcfce7" stroke="#16803c" stroke-width="2"/><text x="260" y="1041" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">кот$</text><rect x="611.0" y="1016" width="58" height="38" rx="7" fill="#dcfce7" stroke="#16803c" stroke-width="2"/><text x="640" y="1041" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">ком$</text><rect x="421.0" y="1016" width="58" height="38" rx="7" fill="#dcfce7" stroke="#16803c" stroke-width="2"/><text x="450" y="1041" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">ко$</text><rect x="14" y="1125" width="872" height="352" rx="10" fill="#f8fafc" stroke="#dbe2ec"/><text x="28" y="1153" font-size="20" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Шаг 4. Удаляем ко$</text><text x="28" y="1180" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Убираем только ветвь $. Две другие ветви ещё нужны, поэтому ко не сжимаем.</text><path d="M450,1256 L450,1293" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="455.0" y="1269.5" font-size="14" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">ко</text><path d="M450,1336 L260,1388" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="360.0" y="1357.0" font-size="14" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">т$</text><path d="M450,1336 L640,1388" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="550.0" y="1357.0" font-size="14" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">м$</text><rect x="411.0" y="1217" width="78" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="450" y="1242" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">корень</text><rect x="421.0" y="1297" width="58" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="450" y="1322" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">•</text><rect x="231.0" y="1392" width="58" height="38" rx="7" fill="#dcfce7" stroke="#16803c" stroke-width="2"/><text x="260" y="1417" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">кот$</text><rect x="611.0" y="1392" width="58" height="38" rx="7" fill="#dcfce7" stroke="#16803c" stroke-width="2"/><text x="640" y="1417" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">ком$</text><rect x="14" y="1501" width="872" height="277" rx="10" fill="#f8fafc" stroke="#dbe2ec"/><text x="28" y="1529" font-size="20" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Шаг 5. Удаляем кот$</text><text x="28" y="1556" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">После удаления ветви т$ осталась одна ветвь. Склеиваем ко и м$ в ком$.</text><path d="M450,1632 L450,1689" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="455.0" y="1655.5" font-size="14" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">ком$</text><rect x="411.0" y="1593" width="78" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="450" y="1618" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">корень</text><rect x="421.0" y="1693" width="58" height="38" rx="7" fill="#dcfce7" stroke="#16803c" stroke-width="2"/><text x="450" y="1718" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">ком$</text></svg>