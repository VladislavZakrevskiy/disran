<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1738" viewBox="0 0 900 1738" role="img"><title>КЧ-удаление: три независимых простых примера</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#64748b"/></marker></defs><rect width="900" height="1738" fill="white"/><text x="28" y="37" font-size="23" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">КЧ-удаление: три независимых простых примера</text><rect x="14" y="72" width="872" height="242" rx="10" fill="#f8fafc" stroke="#dbe2ec"/><text x="28" y="100" font-size="20" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Шаг 1. А. До удаления красного листа 5</text><text x="28" y="127" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Красный лист можно убрать без восстановления чёрной высоты.</text><path d="M450.0,203 L237.5,230" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M450.0,203 L662.5,230" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="421.0" y="164" width="58" height="38" rx="7" fill="#243247" stroke="#243247" stroke-width="2"/><text x="450.0" y="189" font-size="17" fill="white" text-anchor="middle" font-family="monospace">10Ч</text><rect x="208.5" y="234" width="58" height="38" rx="7" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/><text x="237.5" y="259" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">5К</text><rect x="633.5" y="234" width="58" height="38" rx="7" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/><text x="662.5" y="259" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">15К</text><rect x="14" y="338" width="872" height="242" rx="10" fill="#f8fafc" stroke="#dbe2ec"/><text x="28" y="366" font-size="20" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Шаг 2. А. После удаления 5</text><text x="28" y="393" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Количество чёрных вершин на путях не изменилось.</text><path d="M450.0,469 L662.5,496" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="421.0" y="430" width="58" height="38" rx="7" fill="#243247" stroke="#243247" stroke-width="2"/><text x="450.0" y="455" font-size="17" fill="white" text-anchor="middle" font-family="monospace">10Ч</text><rect x="633.5" y="500" width="58" height="38" rx="7" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/><text x="662.5" y="525" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">15К</text><rect x="14" y="604" width="872" height="312" rx="10" fill="#f8fafc" stroke="#dbe2ec"/><text x="28" y="632" font-size="20" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Шаг 3. Б. До удаления чёрного 15</text><text x="28" y="659" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">У 15 один красный ребёнок 20. Это другое исходное дерево.</text><path d="M450.0,735 L237.5,762" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M662.5,805 L768.75,832" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M450.0,735 L662.5,762" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="421.0" y="696" width="58" height="38" rx="7" fill="#243247" stroke="#243247" stroke-width="2"/><text x="450.0" y="721" font-size="17" fill="white" text-anchor="middle" font-family="monospace">10Ч</text><rect x="208.5" y="766" width="58" height="38" rx="7" fill="#243247" stroke="#243247" stroke-width="2"/><text x="237.5" y="791" font-size="17" fill="white" text-anchor="middle" font-family="monospace">5Ч</text><rect x="633.5" y="766" width="58" height="38" rx="7" fill="#243247" stroke="#243247" stroke-width="2"/><text x="662.5" y="791" font-size="17" fill="white" text-anchor="middle" font-family="monospace">15Ч</text><rect x="739.75" y="836" width="58" height="38" rx="7" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/><text x="768.75" y="861" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">20К</text><rect x="14" y="940" width="872" height="242" rx="10" fill="#f8fafc" stroke="#dbe2ec"/><text x="28" y="968" font-size="20" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Шаг 4. Б. Поднимаем 20 и красим в чёрный</text><text x="28" y="995" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">20 заменяет удалённый чёрный узел на всех соответствующих путях.</text><path d="M450.0,1071 L237.5,1098" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M450.0,1071 L662.5,1098" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="421.0" y="1032" width="58" height="38" rx="7" fill="#243247" stroke="#243247" stroke-width="2"/><text x="450.0" y="1057" font-size="17" fill="white" text-anchor="middle" font-family="monospace">10Ч</text><rect x="208.5" y="1102" width="58" height="38" rx="7" fill="#243247" stroke="#243247" stroke-width="2"/><text x="237.5" y="1127" font-size="17" fill="white" text-anchor="middle" font-family="monospace">5Ч</text><rect x="633.5" y="1102" width="58" height="38" rx="7" fill="#243247" stroke="#243247" stroke-width="2"/><text x="662.5" y="1127" font-size="17" fill="white" text-anchor="middle" font-family="monospace">20Ч</text><rect x="14" y="1206" width="872" height="242" rx="10" fill="#f8fafc" stroke="#dbe2ec"/><text x="28" y="1234" font-size="20" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Шаг 5. В. До удаления корня 10</text><text x="28" y="1261" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">В новом исходном дереве у 10 два ребёнка. Минимум справа — красный 15.</text><path d="M450.0,1337 L237.5,1364" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M450.0,1337 L662.5,1364" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="421.0" y="1298" width="58" height="38" rx="7" fill="#243247" stroke="#243247" stroke-width="2"/><text x="450.0" y="1323" font-size="17" fill="white" text-anchor="middle" font-family="monospace">10Ч</text><rect x="208.5" y="1368" width="58" height="38" rx="7" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/><text x="237.5" y="1393" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">5К</text><rect x="633.5" y="1368" width="58" height="38" rx="7" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/><text x="662.5" y="1393" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">15К</text><rect x="14" y="1472" width="872" height="242" rx="10" fill="#f8fafc" stroke="#dbe2ec"/><text x="28" y="1500" font-size="20" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Шаг 6. В. Перенесли 15, удалили прежний красный лист</text><text x="28" y="1527" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Цвет корня остался чёрным: переносим ключ, а не цвет удаляемого узла.</text><path d="M450.0,1603 L237.5,1630" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="421.0" y="1564" width="58" height="38" rx="7" fill="#243247" stroke="#243247" stroke-width="2"/><text x="450.0" y="1589" font-size="17" fill="white" text-anchor="middle" font-family="monospace">15Ч</text><rect x="208.5" y="1634" width="58" height="38" rx="7" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/><text x="237.5" y="1659" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">5К</text></svg>