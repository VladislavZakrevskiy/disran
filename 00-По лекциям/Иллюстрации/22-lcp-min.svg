<svg xmlns="http://www.w3.org/2000/svg" width="900" height="912" viewBox="0 0 900 912" role="img"><title>LCP интервала — минимум значений его детей</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#64748b"/></marker></defs><rect width="900" height="912" fill="white"/><text x="28" y="37" font-size="23" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">LCP интервала — минимум значений его детей</text><rect x="14" y="72" width="872" height="214" rx="10" fill="#f8fafc" stroke="#dbe2ec"/><text x="28" y="100" font-size="20" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Шаг 1. Сначала соседние пары</text><text x="28" y="127" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">LCP(2,3)=3: aba и abacaba имеют общий префикс aba.</text><text x="32" y="180" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Пары</text><rect x="166.5" y="155" width="47" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="190" y="180" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">1–2</text><rect x="218.5" y="155" width="47" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="242" y="180" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">2–3</text><rect x="270.5" y="155" width="47" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="294" y="180" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">3–4</text><rect x="322.5" y="155" width="47" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="346" y="180" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">4–5</text><rect x="374.5" y="155" width="47" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="398" y="18