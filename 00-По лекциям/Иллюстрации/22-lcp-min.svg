 min(LCP(2,3), LCP(3,4)) = min(3,1) = 1.</text><path d="M450.0,441 L237.5,468" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M450.0,441 L662.5,468" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="398.0" y="402" width="104" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="450.0" y="427" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">[2,4]: 1</text><rect x="185.5" y="472" width="104" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="237.5" y="497" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">[2,3]: 3</text><rect x="610.5" y="472" width="104" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="662.5" y="497" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">[3,4]: 1</text><rect x="14" y="576" width="872" height="312" rx="10" fill="#f8fafc" stroke="#dbe2ec"/><text x="28" y="604" font-size="20" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Шаг 3. Поднимаемся к [1,4]</text><text x="28" y="631" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Берём min(1,1) = 1. Каждый готовый результат используется родителем.</text><path d="M450.0,707 L237.5,734" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M662.5,777 L556.25,804" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M662.5,777 L768.75,804" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M450.0,707 L662.5,734" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="398.0" y="668" width="104" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="450.0" y="693" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">[1,4]: 1</text><rect x="185.5" y="738" width="104" height="38" rx