<svg xmlns="http://www.w3.org/2000/svg" width="900" height="999" viewBox="0 0 900 999" role="img"><title>Поиск в дереве: окончание внутри ребра тоже подходит</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#64748b"/></marker></defs><rect width="900" height="999" fill="white"/><text x="28" y="37" font-size="23" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Поиск в дереве: окончание внутри ребра тоже подходит</text><rect x="14" y="72" width="872" height="372" rx="10" fill="#f8fafc" stroke="#dbe2ec"/><text x="28" y="100" font-size="20" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Шаг 1. Ищем a</text><text x="28" y="127" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Из корня идём по a. Образец кончился во внутренней вершине.</text><path d="M450,203 L250,250" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="355.0" y="221.5" font-size="14" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">a</text><path d="M250,293 L140,355" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="200.0" y="319.0" font-size="14" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">ba$</text><path d="M250,293 L350,355" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="305.0" y="319.0" font-size="14" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">$</text><path d="M450,203 L600,260" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="530.0" y="226.5" font-size="14" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">ba$</text><path d="M450,203 L790,260" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="625.0" y="226.5" font-size="14" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">$</text><rect x="411.0" y="164" width="78" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="450" y="189" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">корень</text><rect x="221.0" y="254" width="58" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="250" y="279" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">a</text><rect x="101.0" y="359" width="78" height="38" rx="7" fill="#dcfce7" stroke="#16803c" stroke-width="2"/><text x="140" y="384" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">лист 1</text><rect x="311.0" y="359" width="78" height="38" rx="7" fill="#dcfce7" stroke="#16803c" stroke-width="2"/><text x="350" y="384" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">лист 3</text><rect x="561.0" y="264" width="78" height="38" rx="7" fill="#dcfce7" stroke="#16803c" stroke-width="2"/><text x="600" y="289" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">лист 2</text><rect x="751.0" y="264" width="78" height="38" rx="7" fill="#dcfce7" stroke="#16803c" stroke-width="2"/><text x="790" y="289" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">лист 4</text><rect x="14" y="468" width="872" height="214" rx="10" fill="#f8fafc" stroke="#dbe2ec"/><text x="28" y="496" font-size="20" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Шаг 2. Выписываем листья под вершиной a</text><text x="28" y="523" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Ниже находятся листья 1 и 3: a встречается с позиций 1 и 3.</text><text x="32" y="576" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Текст</text><rect x="168.0" y="551" width="44" height="38" rx="7" fill="#dcfce7" stroke="#16803c" stroke-width="2"/><text x="190" y="576" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">a</text><rect x="217.0" y="551" width="44" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="239" y="576" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">b</text><rect x="266.0" y="551" width="44" height="38" rx="7" fill="#dcfce7" stroke="#16803c" stroke-width="2"/><text x="288" y="576" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">a</text><text x="32" y="631" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Ответ</text><rect x="168.0" y="606" width="44" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="190" y="631" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">1</text><rect x="217.0" y="606" width="44" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="239" y="631" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">3</text><rect x="14" y="706" width="872" height="269" rx="10" fill="#f8fafc" stroke="#dbe2ec"/><text x="28" y="734" font-size="20" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Шаг 3. Ищем ab</text><text x="28" y="761" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Прошли a, затем первую b ребра ba$. Образец кончился внутри ребра.</text><text x="32" y="814" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Путь</text><rect x="168.0" y="789" width="44" height="38" rx="7" fill="#dcfce7" stroke="#16803c" stroke-width="2"/><text x="190" y="814" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">a</text><rect x="217.0" y="789" width="44" height="38" rx="7" fill="#dcfce7" stroke="#16803c" stroke-width="2"/><text x="239" y="814" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">b</text><rect x="266.0" y="789" width="44" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="288" y="814" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">a</text><rect x="315.0" y="789" width="44" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="337" y="814" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">$</text><text x="32" y="869" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Образец</text><rect x="168.0" y="844" width="44" height="38" rx="7" fill="#dcfce7" stroke="#16803c" stroke-width="2"/><text x="190" y="869" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">a</text><rect x="217.0" y="844" width="44" height="38" rx="7" fill="#dcfce7" stroke="#16803c" stroke-width="2"/><text x="239" y="869" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">b</text><text x="32" y="924" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Ответ</text><rect x="168.0" y="899" width="44" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="190" y="924" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">1</text></svg>