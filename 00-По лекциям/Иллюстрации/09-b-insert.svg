<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1598" viewBox="0 0 900 1598" role="img"><title>B-дерево, t=2: максимум три ключа в узле</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#64748b"/></marker></defs><rect width="900" height="1598" fill="white"/><text x="28" y="37" font-size="23" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">B-дерево, t=2: максимум три ключа в узле</text><rect x="14" y="72" width="872" height="172" rx="10" fill="#f8fafc" stroke="#dbe2ec"/><text x="28" y="100" font-size="20" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Шаг 1. Вставляем 1, 2, 3</text><text x="28" y="127" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Пока всё дерево — один заполненный лист.</text><rect x="392.5" y="164" width="115" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="450.0" y="189" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">1 | 2 | 3</text><rect x="14" y="268" width="872" height="242" rx="10" fill="#f8fafc" stroke="#dbe2ec"/><text x="28" y="296" font-size="20" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Шаг 2. Перед вставкой 4 разбиваем полный корень</text><text x="28" y="323" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Средний ключ 2 поднимается. Слева остаётся 1, справа — 3.</text><path d="M450.0,399 L237.5,426" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M450.0,399 L662.5,426" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="421.0" y="360" width="58" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="450.0" y="385" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">2</text><rect x="208.5" y="430" width="58" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="237.5" y="455" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">1</text><rect x="633.5" y="430" width="58" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="662.5" y="455" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">3</text><rect x="14" y="534" width="872" height="242" rx="10" fill="#f8fafc" stroke="#dbe2ec"/><text x="28" y="562" font-size="20" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Шаг 3. Вставляем 4 в правый лист</text><text x="28" y="589" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">4 &gt; 2, поэтому выбираем правый диапазон.</text><path d="M450.0,665 L237.5,692" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M450.0,665 L662.5,692" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="421.0" y="626" width="58" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="450.0" y="651" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">2</text><rect x="208.5" y="696" width="58" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="237.5" y="721" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">1</text><rect x="627.0" y="696" width="71" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="662.5" y="721" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">3 | 4</text><rect x="14" y="800" width="872" height="242" rx="10" fill="#f8fafc" stroke="#dbe2ec"/><text x="28" y="828" font-size="20" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Шаг 4. Вставляем 5</text><text x="28" y="855" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">В правом листе стало три ключа. Это допустимый максимум.</text><path d="M450.0,931 L237.5,958" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M450.0,931 L662.5,958" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="421.0" y="892" width="58" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="450.0" y="917" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">2</text><rect x="208.5" y="962" width="58" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="237.5" y="987" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">1</text><rect x="605.0" y="962" width="115" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="662.5" y="987" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">3 | 4 | 5</text><rect x="14" y="1066" width="872" height="242" rx="10" fill="#f8fafc" stroke="#dbe2ec"/><text x="28" y="1094" font-size="20" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Шаг 5. Перед вставкой 6 делим полный правый лист</text><text x="28" y="1121" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">4 поднимается в корень. Вместо одного листа появились [3] и [5].</text><path d="M450.0,1197 L166.66666666666666,1224" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M450.0,1197 L450.0,1224" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M450.0,1197 L733.3333333333333,1224" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="414.5" y="1158" width="71" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="450.0" y="1183" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">2 | 4</text><rect x="137.66666666666666" y="1228" width="58" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="166.66666666666666" y="1253" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">1</text><rect x="421.0" y="1228" width="58" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="450.0" y="1253" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">3</text><rect x="704.3333333333333" y="1228" width="58" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="733.3333333333333" y="1253" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">5</text><rect x="14" y="1332" width="872" height="242" rx="10" fill="#f8fafc" stroke="#dbe2ec"/><text x="28" y="1360" font-size="20" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Шаг 6. Добавляем 6 в последний диапазон</text><text x="28" y="1387" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Корень содержит два ключа и три ссылки. Все листья на одном уровне.</text><path d="M450.0,1463 L166.66666666666666,1490" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M450.0,1463 L450.0,1490" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M450.0,1463 L733.3333333333333,1490" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="414.5" y="1424" width="71" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="450.0" y="1449" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">2 | 4</text><rect x="137.66666666666666" y="1494" width="58" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="166.66666666666666" y="1519" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">1</text><rect x="421.0" y="1494" width="58" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="450.0" y="1519" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">3</text><rect x="697.8333333333333" y="1494" width="71" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="733.3333333333333" y="1519" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">5 | 6</text></svg>