<svg xmlns="http://www.w3.org/2000/svg" width="900" height="731" viewBox="0 0 900 731" role="img"><title>Сильный хороший суффикс: не повторяем известную неудачу</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#64748b"/></marker></defs><rect width="900" height="731" fill="white"/><text x="28" y="37" font-size="23" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Сильный хороший суффикс: не повторяем известную неудачу</text><rect x="14" y="72" width="872" height="214" rx="10" fill="#f8fafc" stroke="#dbe2ec"/><text x="28" y="100" font-size="20" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Шаг 1. В конце abcabcabc совпало abc</text><text x="28" y="127" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Перед совпавшим концом в тексте x, а в образце c. Значит, x ≠ c уже известно.</text><text x="32" y="180" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">P</text><rect x="168.0" y="155" width="44" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="190" y="180" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">a</text><rect x="217.0" y="155" width="44" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="239" y="180" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">b</text><rect x="266.0" y="155" width="44" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="288" y="180" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">c</text><rect x="315.0" y="155" width="44" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="337" y="180" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">a</text><rect x="364.0" y="155" width="44" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="386" y="180" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">b</text><rect x="413.0" y="155" width="44" height="38" rx="7" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/><text x="435" y="180" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">c</text><rect x="462.0" y="155" width="44" height="38" rx="7" fill="#dcfce7" stroke="#16803c" stroke-width="2"/><text x="484" y="180" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">a</text><rect x="511.0" y="155" width="44" height="38" rx="7" fill="#dcfce7" stroke="#16803c" stroke-width="2"/><text x="533" y="180" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">b</text><rect x="560.0" y="155" width="44" height="38" rx="7" fill="#dcfce7" stroke="#16803c" stroke-width="2"/><text x="582" y="180" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">c</text><text x="32" y="235" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Хвост T</text><rect x="413.0" y="210" width="44" height="38" rx="7" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/><text x="435" y="235" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">x</text><rect x="462.0" y="210" width="44" height="38" rx="7" fill="#dcfce7" stroke="#16803c" stroke-width="2"/><text x="484" y="235" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">a</text><rect x="511.0" y="210" width="44" height="38" rx="7" fill="#dcfce7" stroke="#16803c" stroke-width="2"/><text x="533" y="235" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">b</text><rect x="560.0" y="210" width="44" height="38" rx="7" fill="#dcfce7" stroke="#16803c" stroke-width="2"/><text x="582" y="235" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">c</text><rect x="14" y="310" width="872" height="159" rx="10" fill="#f8fafc" stroke="#dbe2ec"/><text x="28" y="338" font-size="20" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Шаг 2. Средняя копия abc не годится</text><text x="28" y="365" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Перед ней тоже c. Если совместить её с найденным концом, снова получим x ≠ c.</text><text x="32" y="418" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">P</text><rect x="168.0" y="393" width="44" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="190" y="418" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">a</text><rect x="217.0" y="393" width="44" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="239" y="418" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">b</text><rect x="266.0" y="393" width="44" height="38" rx="7" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/><text x="288" y="418" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">c</text><rect x="315.0" y="393" width="44" height="38" rx="7" fill="#fef3c7" stroke="#a16207" stroke-width="2"/><text x="337" y="418" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">a</text><rect x="364.0" y="393" width="44" height="38" rx="7" fill="#fef3c7" stroke="#a16207" stroke-width="2"/><text x="386" y="418" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">b</text><rect x="413.0" y="393" width="44" height="38" rx="7" fill="#fef3c7" stroke="#a16207" stroke-width="2"/><text x="435" y="418" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">c</text><rect x="462.0" y="393" width="44" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="484" y="418" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">a</text><rect x="511.0" y="393" width="44" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="533" y="418" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">b</text><rect x="560.0" y="393" width="44" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="582" y="418" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">c</text><rect x="14" y="493" width="872" height="214" rx="10" fill="#f8fafc" stroke="#dbe2ec"/><text x="28" y="521" font-size="20" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Шаг 3. Берём начальную копию abc</text><text x="28" y="548" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Перед начальной копией нет буквы. Сдвиг 9−3=6 сохраняет известное abc.</text><text x="32" y="601" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">P</text><rect x="168.0" y="576" width="44" height="38" rx="7" fill="#dcfce7" stroke="#16803c" stroke-width="2"/><text x="190" y="601" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">a</text><rect x="217.0" y="576" width="44" height="38" rx="7" fill="#dcfce7" stroke="#16803c" stroke-width="2"/><text x="239" y="601" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">b</text><rect x="266.0" y="576" width="44" height="38" rx="7" fill="#dcfce7" stroke="#16803c" stroke-width="2"/><text x="288" y="601" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">c</text><rect x="315.0" y="576" width="44" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="337" y="601" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">a</text><rect x="364.0" y="576" width="44" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="386" y="601" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">b</text><rect x="413.0" y="576" width="44" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="435" y="601" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">c</text><rect x="462.0" y="576" width="44" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="484" y="601" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">a</text><rect x="511.0" y="576" width="44" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="533" y="601" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">b</text><rect x="560.0" y="576" width="44" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="582" y="601" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">c</text><text x="32" y="656" font-size="16" fill="#172235" text-anchor="start" font-family="Arial, sans-serif">Сдвиг</text><rect x="168.0" y="631" width="44" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="190" y="656" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">9</text><rect x="217.0" y="631" width="44" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="239" y="656" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">−</text><rect x="266.0" y="631" width="44" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="288" y="656" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">3</text><rect x="315.0" y="631" width="44" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="337" y="656" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">=</text><rect x="364.0" y="631" width="44" height="38" rx="7" fill="#e0edff" stroke="#2563eb" stroke-width="2"/><text x="386" y="656" font-size="17" fill="#172235" text-anchor="middle" font-family="monospace">6</text></svg>